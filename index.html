<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Circle World</title>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #080b11;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    user-select: none;
}

canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
}

/* =========================================================
   CONNECTION PANEL
========================================================= */

#ui {
    position: fixed;
    inset: 0;
    z-index: 50;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
        radial-gradient(
            circle at center,
            rgba(40, 55, 90, 0.25),
            rgba(5, 7, 12, 0.92) 65%
        );
    transition:
        opacity 0.45s ease,
        visibility 0.45s ease,
        transform 0.45s ease;
}

#ui.hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transform: scale(1.04);
}

.panel {
    width: min(390px, calc(100vw - 35px));
    padding: 30px;
    border-radius: 24px;

    background:
        linear-gradient(
            145deg,
            rgba(29, 35, 49, 0.96),
            rgba(13, 17, 25, 0.96)
        );

    border: 1px solid rgba(255,255,255,0.12);

    box-shadow:
        0 30px 100px rgba(0,0,0,0.65),
        inset 0 1px 0 rgba(255,255,255,0.06);

    backdrop-filter: blur(22px);

    animation: panelIn 0.55s ease;
}

@keyframes panelIn {
    from {
        opacity: 0;
        transform: translateY(20px) scale(0.96);
    }

    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

.logo {
    width: 62px;
    height: 62px;
    margin-bottom: 18px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle at 32% 27%,
            #ffffff,
            #9bb0ff 16%,
            #5c76ff 45%,
            #293c9d 100%
        );

    box-shadow:
        0 0 45px rgba(91, 117, 255, 0.45),
        inset -8px -10px 15px rgba(0,0,0,0.25);

    border: 3px solid rgba(255,255,255,0.25);
}

.title {
    color: white;
    font-size: 31px;
    font-weight: 900;
    letter-spacing: -1px;
}

.subtitle {
    margin-top: 6px;
    margin-bottom: 25px;
    color: #8d98ac;
    font-size: 14px;
    line-height: 1.5;
}

label {
    display: block;
    margin-bottom: 7px;
    color: #adb6c8;
    font-size: 12px;
    font-weight: 700;
}

input {
    width: 100%;
    height: 48px;
    margin-bottom: 13px;

    padding: 0 15px;

    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.1);

    outline: none;

    color: white;
    background: rgba(255,255,255,0.055);

    font-size: 14px;

    transition:
        border 0.2s,
        background 0.2s,
        box-shadow 0.2s;
}

input::placeholder {
    color: #626c7e;
}

input:focus {
    border-color: rgba(102,126,255,0.8);

    background: rgba(255,255,255,0.08);

    box-shadow:
        0 0 0 3px rgba(82,108,255,0.12);
}

button {
    width: 100%;
    height: 48px;

    border: 0;
    border-radius: 12px;

    margin-bottom: 9px;

    color: white;
    font-size: 14px;
    font-weight: 800;

    cursor: pointer;

    background:
        linear-gradient(
            135deg,
            #647cff,
            #465fe0
        );

    box-shadow:
        0 8px 25px rgba(71,92,220,0.25);

    transition:
        transform 0.15s,
        filter 0.15s,
        box-shadow 0.15s;
}

button:hover {
    filter: brightness(1.08);
    transform: translateY(-1px);

    box-shadow:
        0 12px 30px rgba(71,92,220,0.35);
}

button:active {
    transform: translateY(1px);
}

button.secondary {
    background: rgba(255,255,255,0.065);
    box-shadow: none;
}

button.secondary:hover {
    background: rgba(255,255,255,0.1);
}

.divider {
    display: flex;
    align-items: center;
    gap: 10px;

    margin: 17px 0;

    color: #586274;
    font-size: 11px;
    font-weight: 700;
}

.divider::before,
.divider::after {
    content: "";
    height: 1px;
    flex: 1;

    background: rgba(255,255,255,0.08);
}

#status {
    min-height: 18px;
    margin-top: 7px;

    color: #7f8ba1;
    font-size: 12px;
    text-align: center;

    line-height: 1.4;
}

#roomCode {
    display: none;

    margin-top: 8px;
    margin-bottom: 9px;

    padding: 13px;

    border-radius: 12px;

    color: #9badff;
    background: rgba(89,111,255,0.08);

    border: 1px solid rgba(89,111,255,0.18);

    font-size: 21px;
    font-weight: 900;
    letter-spacing: 5px;

    text-align: center;
}

#roomCode.show {
    display: block;
}

/* =========================================================
   GAME HUD
========================================================= */

#hud {
    position: fixed;
    top: 18px;
    left: 18px;

    z-index: 20;

    display: flex;
    align-items: center;
    gap: 10px;

    pointer-events: none;

    opacity: 0;
    transform: translateY(-10px);

    transition:
        opacity 0.4s,
        transform 0.4s;
}

#hud.visible {
    opacity: 1;
    transform: translateY(0);
}

.hudBox {
    padding: 10px 14px;

    border-radius: 12px;

    background: rgba(10,13,19,0.72);

    border: 1px solid rgba(255,255,255,0.09);

    box-shadow:
        0 10px 30px rgba(0,0,0,0.25);

    backdrop-filter: blur(12px);

    color: #dbe0eb;

    font-size: 12px;
}

#connectionDot {
    display: inline-block;

    width: 8px;
    height: 8px;

    margin-right: 7px;

    border-radius: 50%;

    background: #5de28b;

    box-shadow:
        0 0 10px rgba(93,226,139,0.7);
}

#playerCount {
    color: white;
    font-weight: 800;
}

/* =========================================================
   ROOM BUTTON
========================================================= */

#roomButton {
    position: fixed;

    right: 18px;
    top: 18px;

    z-index: 20;

    width: auto;
    height: auto;

    padding: 10px 14px;

    margin: 0;

    color: #aeb8ca;

    background: rgba(10,13,19,0.72);

    border: 1px solid rgba(255,255,255,0.09);

    box-shadow: none;

    backdrop-filter: blur(12px);

    pointer-events: auto;

    opacity: 0;

    transition:
        opacity 0.4s,
        background 0.2s;
}

#roomButton.visible {
    opacity: 1;
}

#roomButton:hover {
    background: rgba(255,255,255,0.09);
}

/* =========================================================
   CONTROLS
========================================================= */

#controls {
    position: fixed;

    bottom: 18px;
    left: 50%;

    transform: translateX(-50%);

    z-index: 20;

    padding: 10px 17px;

    border-radius: 12px;

    background: rgba(10,13,19,0.72);

    border: 1px solid rgba(255,255,255,0.08);

    color: #8e99ab;

    font-size: 12px;

    backdrop-filter: blur(12px);

    pointer-events: none;

    opacity: 0;

    transition: opacity 0.5s;
}

#controls.visible {
    opacity: 1;
}

#controls b {
    color: #e7ebf4;
}

/* =========================================================
   MESSAGE
========================================================= */

#message {
    position: fixed;

    left: 50%;
    top: 80px;

    transform: translate(-50%, -10px);

    z-index: 100;

    padding: 11px 17px;

    border-radius: 11px;

    background: rgba(10,13,19,0.88);

    border: 1px solid rgba(255,255,255,0.1);

    color: white;

    font-size: 13px;

    opacity: 0;

    pointer-events: none;

    transition:
        opacity 0.25s,
        transform 0.25s;

    backdrop-filter: blur(14px);
}

#message.show {
    opacity: 1;
    transform: translate(-50%, 0);
}

/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 600px) {

    .panel {
        padding: 24px;
    }

    .title {
        font-size: 27px;
    }

    #hud {
        top: 10px;
        left: 10px;
    }

    #roomButton {
        top: 10px;
        right: 10px;
    }

    #controls {
        bottom: 10px;
        font-size: 10px;
        white-space: nowrap;
    }
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<!-- =======================================================
     JOIN / CREATE PANEL
======================================================= -->

<div id="ui">

    <div class="panel">

        <div class="logo"></div>

        <div class="title">
            Circle World
        </div>

        <div class="subtitle">
            A simple multiplayer world.<br>
            Create a room or join your friends.
        </div>

        <label>
            PLAYER NAME
        </label>

        <input
            id="nameInput"
            maxlength="16"
            autocomplete="off"
            placeholder="Enter your name"
        >

        <button id="createBtn">
            Create Room
        </button>

        <div class="divider">
            OR JOIN
        </div>

        <label>
            ROOM CODE
        </label>

        <input
            id="roomInput"
            maxlength="6"
            autocomplete="off"
            placeholder="Example: A7K2QX"
        >

        <button
            id="joinBtn"
            class="secondary"
        >
            Join Room
        </button>

        <div id="roomCode">
            ------
        </div>

        <button
            id="copyBtn"
            class="secondary"
            style="display:none;"
        >
            Copy Room Code
        </button>

        <div id="status">
            Ready.
        </div>

    </div>

</div>

<!-- =======================================================
     HUD
======================================================= -->

<div id="hud">

    <div class="hudBox">
        <span id="connectionDot"></span>
        Connected
    </div>

    <div class="hudBox">
        <span id="playerCount">1</span>
        player<span id="playerPlural"></span>
    </div>

</div>

<button id="roomButton">
    Room: <span id="smallRoomCode">------</span>
</button>

<div id="controls">
    <b>W A S D</b> Move &nbsp; • &nbsp;
    <b>SHIFT</b> Sprint
</div>

<div id="message"></div>

<script>
/* =========================================================
   CANVAS
========================================================= */

const canvas =
    document.getElementById("game");

const ctx =
    canvas.getContext("2d");

let width = window.innerWidth;
let height = window.innerHeight;

let dpr =
    Math.min(window.devicePixelRatio || 1, 2);

function resize() {

    width = window.innerWidth;
    height = window.innerHeight;

    dpr =
        Math.min(window.devicePixelRatio || 1, 2);

    canvas.width =
        width * dpr;

    canvas.height =
        height * dpr;

    canvas.style.width =
        width + "px";

    canvas.style.height =
        height + "px";

    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );
}

window.addEventListener(
    "resize",
    resize
);

resize();

/* =========================================================
   WORLD
========================================================= */

const WORLD = {

    width: 6000,

    height: 6000,

    grid: 100,

    majorGrid: 500
};

/* =========================================================
   LOCAL PLAYER
========================================================= */

const player = {

    id: null,

    name: "Player",

    x: WORLD.width / 2,

    y: WORLD.height / 2,

    vx: 0,

    vy: 0,

    radius: 30,

    color: randomColor(),

    speed: 330,

    sprintSpeed: 540,

    /*
       Used for client prediction.
    */

    inputSequence: 0,

    pendingInputs: [],

    connected: false
};

/* =========================================================
   REMOTE PLAYERS
========================================================= */

const remotePlayers =
    new Map();

/*
    Every remote player has:

    x/y
        Current rendered position.

    targetX/targetY
        Latest authoritative host position.

    renderX/renderY
        Smoothly interpolated visual position.
*/

function createRemotePlayer(data) {

    return {

        id: data.id,

        name: data.name || "Player",

        x: data.x || 0,

        y: data.y || 0,

        targetX: data.x || 0,

        targetY: data.y || 0,

        vx: data.vx || 0,

        vy: data.vy || 0,

        renderX: data.x || 0,

        renderY: data.y || 0,

        radius: 30,

        color: data.color || randomColor()
    };
}

/* =========================================================
   CAMERA
========================================================= */

const camera = {

    x: player.x,

    y: player.y
};

/* =========================================================
   INPUT
========================================================= */

const keys = {};

window.addEventListener(
    "keydown",
    event => {

        const key =
            event.key.toLowerCase();

        if (
            key === "w" ||
            key === "a" ||
            key === "s" ||
            key === "d" ||
            key === "shift"
        ) {
            event.preventDefault();
        }

        keys[key] = true;
    }
);

window.addEventListener(
    "keyup",
    event => {

        keys[
            event.key.toLowerCase()
        ] = false;
    }
);

window.addEventListener(
    "blur",
    () => {

        for (const key in keys) {
            keys[key] = false;
        }
    }
);

/* =========================================================
   PEERJS
========================================================= */

let peer = null;

let isHost = false;

let currentRoom = null;

let hostConnection = null;

const connections =
    new Map();

/* =========================================================
   HOST STATE
========================================================= */

/*
    The host is authoritative.

    That means the host calculates the actual
    position of every player.

    This is much more accurate than having every
    computer independently calculate positions.
*/

const hostPlayers =
    new Map();

const hostInputs =
    new Map();

/* =========================================================
   ROOM CODE
========================================================= */

function generateRoomCode() {

    const characters =
        "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

    let code = "";

    for (
        let i = 0;
        i < 6;
        i++
    ) {

        code +=
            characters[
                Math.floor(
                    Math.random() *
                    characters.length
                )
            ];
    }

    return code;
}

function hostPeerId(code) {

    return (
        "circle-world-" +
        code.toLowerCase()
    );
}

/* =========================================================
   CREATE PEER
========================================================= */

function createPeer(id, callback) {

    if (peer) {

        try {
            peer.destroy();
        } catch {}
    }

    peer =
        new Peer(id);

    peer.on(
        "open",
        peerId => {

            player.id =
                peerId;

            callback();
        }
    );

    peer.on(
        "connection",
        connection => {

            if (!isHost) {
                return;
            }

            setupHostConnection(
                connection
            );
        }
    );

    peer.on(
        "error",
        error => {

            console.error(
                "Peer error:",
                error
            );

            if (
                error.type ===
                "unavailable-id"
            ) {

                showMessage(
                    "That room already exists."
                );

                setStatus(
                    "That room already exists."
                );

            } else if (
                error.type ===
                "peer-unavailable"
            ) {

                showMessage(
                    "Room not found."
                );

                setStatus(
                    "Room not found."
                );

            } else {

                showMessage(
                    "Connection error."
                );

                setStatus(
                    "Connection error."
                );
            }
        }
    );

    peer.on(
        "disconnected",
        () => {

            setStatus(
                "Disconnected."
            );
        }
    );
}

/* =========================================================
   CREATE ROOM
========================================================= */

document
    .getElementById("createBtn")
    .addEventListener(
        "click",
        () => {

            player.name =
                getPlayerName();

            currentRoom =
                generateRoomCode();

            isHost = true;

            document
                .getElementById(
                    "roomCode"
                )
                .textContent =
                currentRoom;

            document
                .getElementById(
                    "roomCode"
                )
                .classList.add("show");

            document
                .getElementById(
                    "copyBtn"
                )
                .style.display =
                "block";

            setStatus(
                "Creating room..."
            );

            createPeer(
                hostPeerId(currentRoom),
                () => {

                    /*
                       Add ourselves to host state.
                    */

                    hostPlayers.set(
                        player.id,
                        {
                            id: player.id,
                            name: player.name,
                            x: player.x,
                            y: player.y,
                            vx: 0,
                            vy: 0,
                            radius: player.radius,
                            color: player.color
                        }
                    );

                    setStatus(
                        "Room ready."
                    );

                    showMessage(
                        "Room created!"
                    );

                    enterGame();
                }
            );
        }
    );

/* =========================================================
   JOIN ROOM
========================================================= */

document
    .getElementById("joinBtn")
    .addEventListener(
        "click",
        () => {

            const code =
                document
                    .getElementById(
                        "roomInput"
                    )
                    .value
                    .trim()
                    .toUpperCase();

            if (code.length !== 6) {

                showMessage(
                    "Enter a 6-character room code."
                );

                return;
            }

            player.name =
                getPlayerName();

            currentRoom =
                code;

            isHost = false;

            setStatus(
                "Connecting..."
            );

            const ownId =
                "circle-player-" +
                Math.random()
                    .toString(36)
                    .slice(2, 12);

            createPeer(
                ownId,
                () => {

                    connectToHost(
                        hostPeerId(code)
                    );
                }
            );
        }
    );

/* =========================================================
   CONNECT TO HOST
========================================================= */

function connectToHost(hostId) {

    const connection =
        peer.connect(
            hostId,
            {
                reliable: true,
                serialization: "json"
            }
        );

    hostConnection =
        connection;

    setupClientConnection(
        connection
    );
}

/* =========================================================
   HOST CONNECTION
========================================================= */

function setupHostConnection(
    connection
) {

    connection.on(
        "open",
        () => {

            console.log(
                "Incoming player connected"
            );
        }
    );

    connection.on(
        "data",
        data => {

            if (!data) {
                return;
            }

            /* -----------------------------------------
               PLAYER HELLO
            ----------------------------------------- */

            if (
                data.type ===
                "hello"
            ) {

                if (!data.id) {
                    return;
                }

                const newPlayer = {

                    id: data.id,

                    name:
                        data.name ||
                        "Player",

                    x:
                        WORLD.width / 2 +
                        (Math.random() - 0.5) * 500,

                    y:
                        WORLD.height / 2 +
                        (Math.random() - 0.5) * 500,

                    vx: 0,

                    vy: 0,

                    radius: 30,

                    color:
                        data.color ||
                        randomColor()
                };

                hostPlayers.set(
                    data.id,
                    newPlayer
                );

                hostInputs.set(
                    data.id,
                    {
                        w: false,
                        a: false,
                        s: false,
                        d: false,
                        shift: false,
                        sequence: 0
                    }
                );

                connections.set(
                    data.id,
                    connection
                );

                /*
                   Send complete current world
                   to the new player.
                */

                sendTo(
                    connection,
                    {
                        type: "welcome",

                        id: data.id,

                        players:
                            getHostPlayers()
                    }
                );

                /*
                   Tell everyone else.
                */

                broadcastHost(
                    {
                        type: "playerJoined",

                        player: newPlayer
                    },
                    data.id
                );

                updatePlayerCount();

                showMessage(
                    data.name +
                    " joined the world."
                );
            }

            /* -----------------------------------------
               INPUT
            ----------------------------------------- */

            if (
                data.type ===
                "input"
            ) {

                const state =
                    hostInputs.get(
                        data.id
                    );

                if (!state) {
                    return;
                }

                /*
                   Store the latest input.

                   The host will simulate this input
                   at a fixed tick rate.
                */

                state.w =
                    !!data.w;

                state.a =
                    !!data.a;

                state.s =
                    !!data.s;

                state.d =
                    !!data.d;

                state.shift =
                    !!data.shift;

                state.sequence =
                    Number(
                        data.sequence
                    ) || 0;
            }
        }
    );

    connection.on(
        "close",
        () => {

            let removedId = null;

            for (
                const [id, c]
                of connections
            ) {

                if (c === connection) {

                    removedId = id;

                    connections.delete(
                        id
                    );

                    hostPlayers.delete(
                        id
                    );

                    hostInputs.delete(
                        id
                    );

                    break;
                }
            }

            if (removedId) {

                broadcastHost({
                    type:
                        "playerLeft",

                    id:
                        removedId
                });

                updatePlayerCount();
            }
        }
    );
}

/* =========================================================
   CLIENT CONNECTION
========================================================= */

function setupClientConnection(
    connection
) {

    connection.on(
        "open",
        () => {

            setStatus(
                "Connected!"
            );

            sendTo(
                connection,
                {
                    type: "hello",

                    id: player.id,

                    name: player.name,

                    color: player.color
                }
            );

            enterGame();
        }
    );

    connection.on(
        "data",
        data => {

            if (!data) {
                return;
            }

            /* -----------------------------------------
               WELCOME
            ----------------------------------------- */

            if (
                data.type ===
                "welcome"
            ) {

                player.id =
                    data.id;

                if (
                    Array.isArray(
                        data.players
                    )
                ) {

                    remotePlayers.clear();

                    for (
                        const p
                        of data.players
                    ) {

                        if (
                            p.id ===
                            player.id
                        ) {

                            /*
                               Server-authoritative spawn.
                            */

                            player.x =
                                p.x;

                            player.y =
                                p.y;

                            continue;
                        }

                        remotePlayers.set(
                            p.id,
                            createRemotePlayer(
                                p
                            )
                        );
                    }
                }

                updatePlayerCount();
            }

            /* -----------------------------------------
               SNAPSHOT
            ----------------------------------------- */

            if (
                data.type ===
                "snapshot"
            ) {

                applySnapshot(
                    data
                );
            }

            /* -----------------------------------------
               PLAYER JOINED
            ----------------------------------------- */

            if (
                data.type ===
                "playerJoined"
            ) {

                const p =
                    data.player;

                if (
                    p &&
                    p.id !== player.id
                ) {

                    remotePlayers.set(
                        p.id,
                        createRemotePlayer(
                            p
                        )
                    );

                    updatePlayerCount();

                    showMessage(
                        p.name +
                        " joined."
                    );
                }
            }

            /* -----------------------------------------
               PLAYER LEFT
            ----------------------------------------- */

            if (
                data.type ===
                "playerLeft"
            ) {

                remotePlayers.delete(
                    data.id
                );

                updatePlayerCount();
            }
        }
    );

    connection.on(
        "close",
        () => {

            hostConnection = null;

            player.connected =
                false;

            showMessage(
                "Connection lost."
            );

            setStatus(
                "Connection lost."
            );

            /*
               Bring the join panel back.
            */

            leaveGameUI();
        }
    );
}

/* =========================================================
   HOST PLAYER LIST
========================================================= */

function getHostPlayers() {

    return [
        ...hostPlayers.values()
    ].map(
        p => ({
            id: p.id,
            name: p.name,
            x: p.x,
            y: p.y,
            vx: p.vx,
            vy: p.vy,
            color: p.color
        })
    );
}

/* =========================================================
   HOST SIMULATION
========================================================= */

/*
    Fixed simulation:

    60 updates every second.

    Every computer receives positions from the same
    authoritative host simulation.

    This prevents two players from slowly drifting
    apart because of different frame rates.
*/

const FIXED_DT =
    1 / 60;

let hostAccumulator = 0;

function hostSimulationTick() {

    if (!isHost) {
        return;
    }

    for (
        const [id, p]
        of hostPlayers
    ) {

        let input;

        if (id === player.id) {

            input = getCurrentInput();

        } else {

            input =
                hostInputs.get(id);

            if (!input) {
                continue;
            }
        }

        simulateMovement(
            p,
            input,
            FIXED_DT
        );
    }
}

/* =========================================================
   MOVEMENT SIMULATION
========================================================= */

function simulateMovement(
    p,
    input,
    dt
) {

    let dx = 0;
    let dy = 0;

    if (input.w) {
        dy -= 1;
    }

    if (input.s) {
        dy += 1;
    }

    if (input.a) {
        dx -= 1;
    }

    if (input.d) {
        dx += 1;
    }

    const length =
        Math.hypot(
            dx,
            dy
        );

    if (length > 0) {

        dx /= length;
        dy /= length;
    }

    const speed =
        input.shift
            ? 540
            : 330;

    /*
       Responsive acceleration.
    */

    const acceleration =
        2300;

    if (length > 0) {

        p.vx +=
            dx *
            acceleration *
            dt;

        p.vy +=
            dy *
            acceleration *
            dt;

    } else {

        /*
           Strong but smooth friction.
        */

        const friction =
            Math.pow(
                0.0005,
                dt
            );

        p.vx *= friction;
        p.vy *= friction;
    }

    /*
       Maximum speed.
    */

    const velocity =
        Math.hypot(
            p.vx,
            p.vy
        );

    if (
        velocity >
        speed
    ) {

        const factor =
            speed /
            velocity;

        p.vx *= factor;
        p.vy *= factor;
    }

    p.x +=
        p.vx *
        dt;

    p.y +=
        p.vy *
        dt;

    /*
       World boundaries.
    */

    const margin =
        p.radius;

    if (
        p.x <
        margin
    ) {

        p.x =
            margin;

        p.vx = 0;
    }

    if (
        p.x >
        WORLD.width -
        margin
    ) {

        p.x =
            WORLD.width -
            margin;

        p.vx = 0;
    }

    if (
        p.y <
        margin
    ) {

        p.y =
            margin;

        p.vy = 0;
    }

    if (
        p.y >
        WORLD.height -
        margin
    ) {

        p.y =
            WORLD.height -
            margin;

        p.vy = 0;
    }
}

/* =========================================================
   CLIENT PREDICTION
========================================================= */

function predictLocalPlayer(
    dt
) {

    if (isHost) {
        return;
    }

    const input =
        getCurrentInput();

    simulateMovement(
        player,
        input,
        dt
    );

    /*
       Save input so that when the host sends
       an authoritative position we can replay
       inputs that happened after that snapshot.
    */

    player.pendingInputs.push({

        sequence:
            player.inputSequence,

        input: {
            ...input
        }
    });

    /*
       Don't allow the prediction buffer
       to grow forever.
    */

    if (
        player.pendingInputs.length >
        120
    ) {

        player.pendingInputs.shift();
    }
}

/* =========================================================
   INPUT
========================================================= */

function getCurrentInput() {

    return {

        w: !!keys.w,

        a: !!keys.a,

        s: !!keys.s,

        d: !!keys.d,

        shift: !!keys.shift
    };
}

/* =========================================================
   SEND INPUT
========================================================= */

let inputSendTimer = 0;

function sendInputToHost(
    dt
) {

    if (
        isHost ||
        !hostConnection ||
        !hostConnection.open
    ) {
        return;
    }

    inputSendTimer += dt;

    /*
       Send inputs 30 times per second.

       This is enough for responsive controls while
       avoiding unnecessary network traffic.
    */

    if (
        inputSendTimer <
        1 / 30
    ) {
        return;
    }

    inputSendTimer = 0;

    player.inputSequence++;

    const input =
        getCurrentInput();

    sendTo(
        hostConnection,
        {
            type: "input",

            id: player.id,

            sequence:
                player.inputSequence,

            ...input
        }
    );
}

/* =========================================================
   SNAPSHOTS
========================================================= */

let snapshotTimer = 0;

function hostSendSnapshots(
    dt
) {

    if (!isHost) {
        return;
    }

    snapshotTimer += dt;

    /*
       30 authoritative snapshots per second.

       Remote players interpolate between these
       positions, making movement look smooth.
    */

    if (
        snapshotTimer <
        1 / 30
    ) {
        return;
    }

    snapshotTimer = 0;

    const snapshot = {

        type: "snapshot",

        time:
            performance.now(),

        players:
            getHostPlayers()
    };

    /*
       Send one authoritative snapshot
       to every connected player.
    */

    broadcastHost(
        snapshot
    );

    /*
       The host doesn't need a network snapshot
       for itself because it already has the
       authoritative state.
    */
}

/* =========================================================
   APPLY SNAPSHOT
========================================================= */

function applySnapshot(
    snapshot
) {

    if (
        !Array.isArray(
            snapshot.players
        )
    ) {
        return;
    }

    for (
        const serverPlayer
        of snapshot.players
    ) {

        if (
            serverPlayer.id ===
            player.id
        ) {

            /*
               HOST-AUTHORITATIVE RECONCILIATION
            */

            const serverX =
                serverPlayer.x;

            const serverY =
                serverPlayer.y;

            /*
               Measure prediction error.
            */

            const error =
                Math.hypot(
                    player.x -
                    serverX,

                    player.y -
                    serverY
                );

            /*
               Small errors are corrected smoothly.

               Large errors are corrected more
               aggressively so the player never
               gets far out of sync.
            */

            if (
                error < 8
            ) {

                player.x =
                    serverX;

                player.y =
                    serverY;

            } else {

                /*
                   Start from authoritative position.
                */

                player.x =
                    serverX;

                player.y =
                    serverY;

                player.vx =
                    serverPlayer.vx;

                player.vy =
                    serverPlayer.vy;

                /*
                   Replay inputs that the host
                   hasn't acknowledged yet.

                   This keeps controls responsive.
                */

                for (
                    const pending
                    of player.pendingInputs
                ) {

                    simulateMovement(
                        player,
                        pending.input,
                        FIXED_DT
                    );
                }
            }

            continue;
        }

        /*
           Remote player.
        */

        let p =
            remotePlayers.get(
                serverPlayer.id
            );

        if (!p) {

            p =
                createRemotePlayer(
                    serverPlayer
                );

            remotePlayers.set(
                serverPlayer.id,
                p
            );
        }

        /*
           Store authoritative target.

           We DO NOT immediately teleport the
           visual player here.

           Instead the renderer interpolates toward
           this target.
        */

        p.targetX =
            serverPlayer.x;

        p.targetY =
            serverPlayer.y;

        p.vx =
            serverPlayer.vx;

        p.vy =
            serverPlayer.vy;

        p.name =
            serverPlayer.name;

        p.color =
            serverPlayer.color;
    }

    updatePlayerCount();
}

/* =========================================================
   REMOTE INTERPOLATION
========================================================= */

function updateRemotePlayers(
    dt
) {

    for (
        const p
        of remotePlayers.values()
    ) {

        /*
           Very smooth interpolation.

           If the network gives us a new target,
           the player visually moves toward it.
        */

        const smoothing =
            1 -
            Math.pow(
                0.00005,
                dt
            );

        p.renderX +=
            (
                p.targetX -
                p.renderX
            ) *
            smoothing;

        p.renderY +=
            (
                p.targetY -
                p.renderY
            ) *
            smoothing;

        p.x =
            p.renderX;

        p.y =
            p.renderY;
    }
}

/* =========================================================
   CAMERA
========================================================= */

function updateCamera(
    dt
) {

    const smoothing =
        1 -
        Math.pow(
            0.00001,
            dt
        );

    camera.x +=
        (
            player.x -
            camera.x
        ) *
        smoothing;

    camera.y +=
        (
            player.y -
            camera.y
        ) *
        smoothing;
}

/* =========================================================
   NETWORK
========================================================= */

function sendTo(
    connection,
    data
) {

    if (
        connection &&
        connection.open
    ) {

        try {

            connection.send(
                data
            );

        } catch (error) {

            console.error(
                error
            );
        }
    }
}

function broadcastHost(
    data,
    exceptId = null
) {

    for (
        const [
            id,
            connection
        ]
        of connections
    ) {

        if (
            id === exceptId
        ) {
            continue;
        }

        sendTo(
            connection,
            data
        );
    }
}

/* =========================================================
   DRAW
========================================================= */

function draw() {

    /*
       Clear.
    */

    ctx.clearRect(
        0,
        0,
        width,
        height
    );

    /*
       Background.
    */

    const background =
        ctx.createLinearGradient(
            0,
            0,
            0,
            height
        );

    background.addColorStop(
        0,
        "#10151e"
    );

    background.addColorStop(
        1,
        "#090c12"
    );

    ctx.fillStyle =
        background;

    ctx.fillRect(
        0,
        0,
        width,
        height
    );

    /*
       Camera.
    */

    ctx.save();

    ctx.translate(
        width / 2 -
        camera.x,

        height / 2 -
        camera.y
    );

    /*
       World ground.
    */

    ctx.fillStyle =
        "#202631";

    ctx.fillRect(
        0,
        0,
        WORLD.width,
        WORLD.height
    );

    drawGrid();

    /*
       World border.
    */

    ctx.strokeStyle =
        "rgba(160,175,205,0.35)";

    ctx.lineWidth = 6;

    ctx.strokeRect(
        0,
        0,
        WORLD.width,
        WORLD.height
    );

    /*
       Remote players.
    */

    for (
        const p
        of remotePlayers.values()
    ) {

        drawPlayer(
            p.x,
            p.y,
            p.radius,
            p.color,
            p.name,
            false
        );
    }

    /*
       Local player.
    */

    drawPlayer(
        player.x,
        player.y,
        player.radius,
        player.color,
        player.name,
        true
    );

    ctx.restore();

    /*
       Screen vignette.
    */

    const vignette =
        ctx.createRadialGradient(
            width / 2,
            height / 2,
            Math.min(
                width,
                height
            ) * 0.25,

            width / 2,
            height / 2,
            Math.max(
                width,
                height
            ) * 0.75
        );

    vignette.addColorStop(
        0,
        "rgba(0,0,0,0)"
    );

    vignette.addColorStop(
        1,
        "rgba(0,0,0,0.42)"
    );

    ctx.fillStyle =
        vignette;

    ctx.fillRect(
        0,
        0,
        width,
        height
    );
}

/* =========================================================
   GRID
========================================================= */

function drawGrid() {

    const left =
        camera.x -
        width / 2 -
        WORLD.grid;

    const right =
        camera.x +
        width / 2 +
        WORLD.grid;

    const top =
        camera.y -
        height / 2 -
        WORLD.grid;

    const bottom =
        camera.y +
        height / 2 +
        WORLD.grid;

    const startX =
        Math.floor(
            left /
            WORLD.grid
        ) *
        WORLD.grid;

    const endX =
        Math.ceil(
            right /
            WORLD.grid
        ) *
        WORLD.grid;

    const startY =
        Math.floor(
            top /
            WORLD.grid
        ) *
        WORLD.grid;

    const endY =
        Math.ceil(
            bottom /
            WORLD.grid
        ) *
        WORLD.grid;

    /*
       Small grid.
    */

    ctx.beginPath();

    ctx.lineWidth = 1;

    ctx.strokeStyle =
        "rgba(255,255,255,0.035)";

    for (
        let x = startX;
        x <= endX;
        x += WORLD.grid
    ) {

        ctx.moveTo(
            x,
            startY
        );

        ctx.lineTo(
            x,
            endY
        );
    }

    for (
        let y = startY;
        y <= endY;
        y += WORLD.grid
    ) {

        ctx.moveTo(
            startX,
            y
        );

        ctx.lineTo(
            endX,
            y
        );
    }

    ctx.stroke();

    /*
       Major grid.
    */

    const majorStartX =
        Math.floor(
            left /
            WORLD.majorGrid
        ) *
        WORLD.majorGrid;

    const majorEndX =
        Math.ceil(
            right /
            WORLD.majorGrid
        ) *
        WORLD.majorGrid;

    const majorStartY =
        Math.floor(
            top /
            WORLD.majorGrid
        ) *
        WORLD.majorGrid;

    const majorEndY =
        Math.ceil(
            bottom /
            WORLD.majorGrid
        ) *
        WORLD.majorGrid;

    ctx.beginPath();

    ctx.strokeStyle =
        "rgba(255,255,255,0.065)";

    for (
        let x =
            majorStartX;

        x <= majorEndX;

        x += WORLD.majorGrid
    ) {

        ctx.moveTo(
            x,
            majorStartY
        );

        ctx.lineTo(
            x,
            majorEndY
        );
    }

    for (
        let y =
            majorStartY;

        y <= majorEndY;

        y += WORLD.majorGrid
    ) {

        ctx.moveTo(
            majorStartX,
            y
        );

        ctx.lineTo(
            majorEndX,
            y
        );
    }

    ctx.stroke();
}

/* =========================================================
   PLAYER DRAWING
========================================================= */

function drawPlayer(
    x,
    y,
    radius,
    color,
    name,
    local
) {

    ctx.save();

    /*
       Shadow.
    */

    ctx.fillStyle =
        "rgba(0,0,0,0.38)";

    ctx.beginPath();

    ctx.ellipse(
        x,
        y + radius * 0.7,
        radius * 0.85,
        radius * 0.28,
        0,
        0,
        Math.PI * 2
    );

    ctx.fill();

    /*
       Local player glow.
    */

    if (local) {

        const glow =
            ctx.createRadialGradient(
                x,
                y,
                radius * 0.5,

                x,
                y,
                radius * 2.2
            );

        glow.addColorStop(
            0,
            hexToRgba(
                color,
                0.22
            )
        );

        glow.addColorStop(
            1,
            "rgba(0,0,0,0)"
        );

        ctx.fillStyle =
            glow;

        ctx.beginPath();

        ctx.arc(
            x,
            y,
            radius * 2.2,
            0,
            Math.PI * 2
        );

        ctx.fill();
    }

    /*
       Outer ring.
    */

    ctx.beginPath();

    ctx.arc(
        x,
        y,
        radius + 2,
        0,
        Math.PI * 2
    );

    ctx.fillStyle =
        local
            ? "rgba(255,255,255,0.9)"
            : "rgba(255,255,255,0.25)";

    ctx.fill();

    /*
       Circle gradient.
    */

    const gradient =
        ctx.createRadialGradient(
            x - radius * 0.35,
            y - radius * 0.42,
            radius * 0.05,

            x,
            y,
            radius
        );

    gradient.addColorStop(
        0,
        lightenColor(
            color,
            55
        )
    );

    gradient.addColorStop(
        0.38,
        color
    );

    gradient.addColorStop(
        1,
        darkenColor(
            color,
            45
        )
    );

    ctx.fillStyle =
        gradient;

    ctx.beginPath();

    ctx.arc(
        x,
        y,
        radius,
        0,
        Math.PI * 2
    );

    ctx.fill();

    /*
       Highlight.
    */

    ctx.fillStyle =
        "rgba(255,255,255,0.38)";

    ctx.beginPath();

    ctx.arc(
        x - radius * 0.32,
        y - radius * 0.37,
        radius * 0.19,
        0,
        Math.PI * 2
    );

    ctx.fill();

    /*
       Nameplate.
    */

    ctx.font =
        "700 13px Arial";

    ctx.textAlign =
        "center";

    ctx.textBaseline =
        "middle";

    const label =
        name || "Player";

    const textWidth =
        ctx.measureText(
            label
        ).width + 16;

    const labelX =
        x -
        textWidth / 2;

    const labelY =
        y -
        radius -
        31;

    ctx.fillStyle =
        "rgba(8,11,16,0.78)";

    roundedRect(
        labelX,
        labelY,
        textWidth,
        21,
        7
    );

    ctx.fill();

    ctx.fillStyle =
        local
            ? "#ffffff"
            : "#d8deea";

    ctx.fillText(
        label,
        x,
        labelY + 10.5
    );

    ctx.restore();
}

/* =========================================================
   ROUNDED RECT
========================================================= */

function roundedRect(
    x,
    y,
    width,
    height,
    radius
) {

    ctx.beginPath();

    ctx.moveTo(
        x + radius,
        y
    );

    ctx.lineTo(
        x + width - radius,
        y
    );

    ctx.quadraticCurveTo(
        x + width,
        y,
        x + width,
        y + radius
    );

    ctx.lineTo(
        x + width,
        y + height - radius
    );

    ctx.quadraticCurveTo(
        x + width,
        y + height,
        x + width - radius,
        y + height
    );

    ctx.lineTo(
        x + radius,
        y + height
    );

    ctx.quadraticCurveTo(
        x,
        y + height,
        x,
        y + height - radius
    );

    ctx.lineTo(
        x,
        y + radius
    );

    ctx.quadraticCurveTo(
        x,
        y,
        x + radius,
        y
    );

    ctx.closePath();
}

/* =========================================================
   COLORS
========================================================= */

function randomColor() {

    const colors = [

        "#6078ff",

        "#ff5d7a",

        "#48d68a",

        "#ffb84f",

        "#a86cff",

        "#36cadb",

        "#ff7147",

        "#e45cff"

    ];

    return colors[
        Math.floor(
            Math.random() *
            colors.length
        )
    ];
}

function hexToRgb(hex) {

    hex =
        hex.replace(
            "#",
            ""
        );

    return {

        r:
            parseInt(
                hex.substring(
                    0,
                    2
                ),
                16
            ),

        g:
            parseInt(
                hex.substring(
                    2,
                    4
                ),
                16
            ),

        b:
            parseInt(
                hex.substring(
                    4,
                    6
                ),
                16
            )
    };
}

function lightenColor(
    hex,
    amount
) {

    const rgb =
        hexToRgb(hex);

    return `rgb(
        ${Math.min(
            255,
            rgb.r + amount
        )},
        ${Math.min(
            255,
            rgb.g + amount
        )},
        ${Math.min(
            255,
            rgb.b + amount
        )}
    )`;
}

function darkenColor(
    hex,
    amount
) {

    const rgb =
        hexToRgb(hex);

    return `rgb(
        ${Math.max(
            0,
            rgb.r - amount
        )},
        ${Math.max(
            0,
            rgb.g - amount
        )},
        ${Math.max(
            0,
            rgb.b - amount
        )}
    )`;
}

/* =========================================================
   MESSAGE
========================================================= */

let messageTimer = null;

function showMessage(
    text
) {

    const element =
        document.getElementById(
            "message"
        );

    element.textContent =
        text;

    element.classList.add(
        "show"
    );

    clearTimeout(
        messageTimer
    );

    messageTimer =
        setTimeout(
            () => {

                element.classList.remove(
                    "show"
                );

            },
            2500
        );
}

/* =========================================================
   COPY ROOM
========================================================= */

document
    .getElementById(
        "copyBtn"
    )
    .addEventListener(
        "click",
        async () => {

            if (!currentRoom) {
                return;
            }

            try {

                await navigator
                    .clipboard
                    .writeText(
                        currentRoom
                    );

                showMessage(
                    "Room code copied!"
                );

            } catch {

                showMessage(
                    "Room code: " +
                    currentRoom
                );
            }
        }
    );

/* =========================================================
   HOST FIXED LOOP
========================================================= */

let previousTime =
    performance.now();

function gameLoop(
    currentTime
) {

    let frameDt =
        (
            currentTime -
            previousTime
        ) / 1000;

    previousTime =
        currentTime;

    /*
       Prevent huge jumps.
    */

    frameDt =
        Math.min(
            frameDt,
            0.05
        );

    /*
       Fixed timestep for host.
    */

    hostAccumulator +=
        frameDt;

    while (
        hostAccumulator >=
        FIXED_DT
    ) {

        /*
           Host controls itself.
        */

        if (isHost) {

            hostSimulationTick();

        } else {

            /*
               Non-host locally predicts
               its own movement.
            */

            predictLocalPlayer(
                FIXED_DT
            );
        }

        hostAccumulator -=
            FIXED_DT;
    }

    /*
       Network input.
    */

    sendInputToHost(
        frameDt
    );

    /*
       Host snapshots.
    */

    hostSendSnapshots(
        frameDt
    );

    /*
       Smooth remote movement.
    */

    updateRemotePlayers(
        frameDt
    );

    /*
       Camera.
    */

    updateCamera(
        frameDt
    );

    /*
       Render.
    */

    draw();

    requestAnimationFrame(
        gameLoop
    );
}

/* =========================================================
   START
========================================================= */

requestAnimationFrame(
    gameLoop
);

/* =========================================================
   CLEAN DISCONNECT
========================================================= */

window.addEventListener(
    "beforeunload",
    () => {

        try {

            if (isHost) {

                broadcastHost({
                    type:
                        "serverClosing"
                });

            } else if (
                hostConnection
            ) {

                sendTo(
                    hostConnection,
                    {
                        type:
                            "playerLeaving",

                        id:
                            player.id
                    }
                );
            }

        } catch {}
    }
);
