<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Circle World Multiplayer</title>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #e8edf3;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    user-select: none;
}

canvas {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    display: block;
    background: #e8edf3;
}

/* =========================
   LOBBY
========================= */

#ui {
    position: fixed;
    inset: 0;
    z-index: 100;

    display: flex;
    align-items: center;
    justify-content: center;

    background:
        radial-gradient(
            circle at 50% 35%,
            rgba(255,255,255,.98),
            rgba(222,229,238,.98)
        );

    transition:
        opacity .25s ease,
        visibility .25s ease;
}

#ui.hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
}

.panel {
    width: min(430px, calc(100vw - 30px));

    padding: 32px;

    border-radius: 24px;

    background: rgba(255,255,255,.96);

    border: 1px solid rgba(15,23,42,.1);

    box-shadow:
        0 30px 80px rgba(15,23,42,.18),
        0 8px 25px rgba(15,23,42,.08);

    backdrop-filter: blur(20px);
}

.logo {
    width: 65px;
    height: 65px;

    margin: 0 auto 18px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle at 30% 25%,
            #ffffff,
            #60a5fa 25%,
            #2563eb 75%,
            #1d4ed8
        );

    box-shadow:
        0 12px 30px rgba(37,99,235,.3),
        inset -8px -8px 15px rgba(0,0,0,.12);
}

h1 {
    margin: 0;

    text-align: center;

    font-size: 29px;
    font-weight: 800;

    letter-spacing: -.8px;
}

.subtitle {
    margin: 8px 0 27px;

    text-align: center;

    color: #64748b;

    font-size: 14px;
}

label {
    display: block;

    margin-bottom: 7px;

    color: #475569;

    font-size: 12px;
    font-weight: 700;
}

input {
    width: 100%;
    height: 48px;

    margin-bottom: 14px;
    padding: 0 14px;

    border: 1px solid #d7dee8;
    border-radius: 12px;

    outline: none;

    background: #f8fafc;
    color: #0f172a;

    font-size: 15px;

    /*
        IMPORTANT:
        The inputs allow WASD to be typed normally.
    */

    user-select: text;
    -webkit-user-select: text;
}

input:focus {
    background: white;

    border-color: #60a5fa;

    box-shadow:
        0 0 0 4px rgba(96,165,250,.13);
}

button {
    width: 100%;
    height: 48px;

    border: 0;
    border-radius: 12px;

    cursor: pointer;

    font-size: 14px;
    font-weight: 750;

    transition:
        transform .1s ease,
        filter .1s ease;
}

button:hover {
    filter: brightness(1.04);
}

button:active {
    transform: scale(.98);
}

.primary {
    background: #2563eb;
    color: white;

    box-shadow:
        0 8px 20px rgba(37,99,235,.2);
}

.secondary {
    margin-top: 9px;

    background: #edf1f6;
    color: #334155;
}

.divider {
    display: flex;

    align-items: center;

    gap: 12px;

    margin: 22px 0;

    color: #94a3b8;

    font-size: 10px;
    font-weight: 800;
}

.divider::before,
.divider::after {
    content: "";

    height: 1px;

    flex: 1;

    background: #e2e8f0;
}

#status {
    min-height: 20px;

    margin-top: 16px;

    text-align: center;

    color: #64748b;

    font-size: 12px;
}

/* =========================
   HUD
========================= */

#hud {
    position: fixed;

    top: 18px;
    left: 18px;

    z-index: 20;

    display: none;

    pointer-events: none;
}

#hud.visible {
    display: block;
}

.hud-card {
    min-width: 195px;

    padding: 13px 16px;

    border-radius: 15px;

    background: rgba(255,255,255,.9);

    border: 1px solid rgba(15,23,42,.1);

    box-shadow:
        0 10px 30px rgba(15,23,42,.12);

    backdrop-filter: blur(12px);
}

.hud-title {
    color: #334155;

    font-size: 12px;
    font-weight: 800;
}

.hud-info {
    margin-top: 4px;

    color: #64748b;

    font-size: 11px;
}

#roomButton {
    position: fixed;

    top: 18px;
    right: 18px;

    z-index: 20;

    display: none;

    width: auto;
    height: auto;

    padding: 11px 15px;

    background: rgba(255,255,255,.92);

    color: #334155;

    border: 1px solid rgba(15,23,42,.1);

    box-shadow:
        0 10px 30px rgba(15,23,42,.1);
}

#roomButton.visible {
    display: block;
}

#controls {
    position: fixed;

    bottom: 18px;
    left: 50%;

    transform: translateX(-50%);

    z-index: 20;

    display: none;

    padding: 9px 15px;

    border-radius: 12px;

    background: rgba(255,255,255,.9);

    color: #64748b;

    font-size: 11px;

    box-shadow:
        0 8px 25px rgba(15,23,42,.1);
}

#controls.visible {
    display: block;
}

/* =========================
   ROOM POPUP
========================= */

#roomPopup {
    position: fixed;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%)
        scale(.96);

    z-index: 200;

    display: none;

    width: min(360px, calc(100vw - 30px));

    padding: 25px;

    border-radius: 20px;

    background: white;

    text-align: center;

    box-shadow:
        0 30px 80px rgba(15,23,42,.25);
}

#roomPopup.visible {
    display: block;

    transform:
        translate(-50%, -50%)
        scale(1);
}

.room-code {
    margin: 16px 0;

    padding: 14px;

    border-radius: 12px;

    background: #f1f5f9;

    font-family: monospace;

    font-size: 23px;
    font-weight: 800;

    letter-spacing: 5px;
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<!-- =========================
     LOBBY
========================= -->

<div id="ui">

    <div class="panel">

        <div class="logo"></div>

        <h1>Circle World</h1>

        <div class="subtitle">
            Multiplayer open-world playground
        </div>

        <label for="name">
            Player Name
        </label>

        <input
            id="name"
            type="text"
            maxlength="16"
            placeholder="Enter your name"
            autocomplete="off"
            spellcheck="false"
        >

        <button
            id="createBtn"
            class="primary"
        >
            Create Room
        </button>

        <div class="divider">
            OR JOIN A ROOM
        </div>

        <label for="roomInput">
            Room Code
        </label>

        <input
            id="roomInput"
            type="text"
            maxlength="6"
            placeholder="ABC123"
            autocomplete="off"
            spellcheck="false"
        >

        <button
            id="joinBtn"
            class="secondary"
        >
            Join Room
        </button>

        <div id="status"></div>

    </div>

</div>


<!-- =========================
     HUD
========================= -->

<div id="hud">

    <div class="hud-card">

        <div
            class="hud-title"
            id="hudName"
        >
            Player
        </div>

        <div
            class="hud-info"
            id="hudInfo"
        >
            Connecting...
        </div>

    </div>

</div>


<button id="roomButton">
    Room
</button>


<div id="controls">
    WASD to move · Shift to sprint
</div>


<!-- =========================
     ROOM POPUP
========================= -->

<div id="roomPopup">

    <div
        style="
            font-size:17px;
            font-weight:800;
        "
    >
        Your Room Code
    </div>

    <div
        id="roomCodeDisplay"
        class="room-code"
    >
        ------
    </div>

    <button
        id="copyBtn"
        class="primary"
    >
        Copy Code
    </button>

    <button
        id="closePopup"
        class="secondary"
    >
        Close
    </button>

</div>


<script>

/* =========================================================
   CANVAS
========================================================= */

const canvas =
    document.getElementById("game");

const ctx =
    canvas.getContext("2d");

let screenWidth =
    window.innerWidth;

let screenHeight =
    window.innerHeight;

let dpr = 1;

function resizeCanvas() {

    dpr =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );

    screenWidth =
        window.innerWidth;

    screenHeight =
        window.innerHeight;

    canvas.width =
        Math.floor(
            screenWidth * dpr
        );

    canvas.height =
        Math.floor(
            screenHeight * dpr
        );

    canvas.style.width =
        screenWidth + "px";

    canvas.style.height =
        screenHeight + "px";

    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );
}

window.addEventListener(
    "resize",
    resizeCanvas
);

resizeCanvas();


/* =========================================================
   WORLD
========================================================= */

const WORLD = {

    width: 6000,

    height: 6000,

    grid: 100,

    majorGrid: 500
};


/* =========================================================
   LOCAL PLAYER
========================================================= */

const player = {

    id: null,

    name: "Player",

    x: WORLD.width / 2,

    y: WORLD.height / 2,

    vx: 0,

    vy: 0,

    radius: 30,

    speed: 360,

    sprintSpeed: 600,

    color: "#3b82f6",

    connected: false,

    inputSequence: 0,

    pendingInputs: []
};


/* =========================================================
   CAMERA
========================================================= */

const camera = {

    x: player.x,

    y: player.y
};


/* =========================================================
   REMOTE PLAYERS
========================================================= */

const remotePlayers =
    new Map();


/* =========================================================
   KEYBOARD
========================================================= */

const keys = {

    w: false,

    a: false,

    s: false,

    d: false,

    shift: false
};

const movementKeys =
    new Set([
        "w",
        "a",
        "s",
        "d",
        "shift"
    ]);


/*
    Clear all movement.

    This is especially important when:
    - clicking an input
    - leaving the lobby
    - tabbing away
    - disconnecting
*/

function clearMovementKeys() {

    keys.w = false;
    keys.a = false;
    keys.s = false;
    keys.d = false;
    keys.shift = false;
}


/*
    Is the user currently typing?
*/

function isTyping() {

    const element =
        document.activeElement;

    if (!element) {
        return false;
    }

    const tag =
        element.tagName;

    return (
        tag === "INPUT" ||
        tag === "TEXTAREA" ||
        tag === "SELECT" ||
        element.isContentEditable
    );
}


/*
    KEY DOWN
*/

window.addEventListener(
    "keydown",
    event => {

        const key =
            event.key.toLowerCase();


        /*
            IMPORTANT:

            If you're typing in the lobby,
            WASD does NOT control the player.

            This means:

            "WASD Gaming"

            can actually be typed.
        */

        if (isTyping()) {
            return;
        }


        /*
            No movement before joining.
        */

        if (!player.connected) {
            return;
        }


        if (
            movementKeys.has(key)
        ) {

            event.preventDefault();

            keys[key] = true;
        }

    },
    false
);


/*
    KEY UP
*/

window.addEventListener(
    "keyup",
    event => {

        const key =
            event.key.toLowerCase();

        if (
            movementKeys.has(key)
        ) {

            keys[key] = false;
        }

    },
    false
);


/*
    Don't get stuck moving if
    browser loses focus.
*/

window.addEventListener(
    "blur",
    clearMovementKeys
);


/*
    Clicking into any input
    immediately stops movement.
*/

document
    .querySelectorAll("input")
    .forEach(input => {

        input.addEventListener(
            "focus",
            clearMovementKeys
        );

    });


/* =========================================================
   GET MOVEMENT
========================================================= */

function getMovementInput() {

    let x = 0;
    let y = 0;

    if (keys.a) {
        x -= 1;
    }

    if (keys.d) {
        x += 1;
    }

    if (keys.w) {
        y -= 1;
    }

    if (keys.s) {
        y += 1;
    }


    /*
        Normalize diagonal movement.

        Without this:

        W + D = faster movement.

        With this:

        W + D = same speed.
    */

    const length =
        Math.hypot(x, y);

    if (length > 0) {

        x /= length;
        y /= length;
    }

    return {
        x,
        y,
        shift: keys.shift
    };
}


/* =========================================================
   MOVE PLAYER
========================================================= */

function movePlayer(
    p,
    input,
    dt
) {

    const speed =
        input.shift
            ? p.sprintSpeed
            : p.speed;


    p.vx =
        input.x * speed;

    p.vy =
        input.y * speed;


    p.x +=
        p.vx * dt;

    p.y +=
        p.vy * dt;


    /*
        World boundaries.

        Player cannot leave world.
    */

    const radius =
        p.radius;


    if (
        p.x < radius
    ) {

        p.x = radius;
        p.vx = 0;
    }


    if (
        p.x >
        WORLD.width - radius
    ) {

        p.x =
            WORLD.width - radius;

        p.vx = 0;
    }


    if (
        p.y < radius
    ) {

        p.y = radius;
        p.vy = 0;
    }


    if (
        p.y >
        WORLD.height - radius
    ) {

        p.y =
            WORLD.height - radius;

        p.vy = 0;
    }
}


/* =========================================================
   PEER
========================================================= */

let peer = null;

let isHost = false;

let roomCode = "";

let hostPeerId = "";

let clientConnection = null;

const hostPlayers =
    new Map();

const hostInputs =
    new Map();

const hostConnections =
    new Map();


/* =========================================================
   RANDOM PLAYER COLOR
========================================================= */

function randomColor() {

    const colors = [

        "#3b82f6",

        "#ef4444",

        "#22c55e",

        "#a855f7",

        "#f97316",

        "#06b6d4",

        "#eab308",

        "#ec4899",

        "#14b8a6",

        "#8b5cf6"

    ];

    return colors[
        Math.floor(
            Math.random() *
            colors.length
        )
    ];
}


/* =========================================================
   ROOM CODE
========================================================= */

function generateRoomCode() {

    const chars =
        "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

    let result = "";

    for (
        let i = 0;
        i < 6;
        i++
    ) {

        result +=
            chars[
                Math.floor(
                    Math.random() *
                    chars.length
                )
            ];
    }

    return result;
}


/* =========================================================
   UI
========================================================= */

const ui =
    document.getElementById("ui");

const status =
    document.getElementById("status");

const hud =
    document.getElementById("hud");

const hudName =
    document.getElementById("hudName");

const hudInfo =
    document.getElementById("hudInfo");

const controls =
    document.getElementById("controls");

const roomButton =
    document.getElementById("roomButton");

const roomPopup =
    document.getElementById("roomPopup");


function setStatus(text) {

    status.textContent = text;
}


/* =========================================================
   ENTER GAME
========================================================= */

function enterGame() {

    /*
        Kill any keys that may have been
        pressed while leaving the lobby.
    */

    clearMovementKeys();


    /*
        The player is now allowed to move.
    */

    player.connected = true;


    /*
        Hide lobby COMPLETELY.
    */

    ui.classList.add(
        "hidden"
    );


    /*
        Show gameplay UI.
    */

    hud.classList.add(
        "visible"
    );

    controls.classList.add(
        "visible"
    );

    roomButton.classList.add(
        "visible"
    );


    hudName.textContent =
        player.name;


    /*
        Start camera directly on player.
    */

    camera.x =
        player.x;

    camera.y =
        player.y;


    updateHUD();
}


/* =========================================================
   LEAVE GAME
========================================================= */

function leaveGame() {

    clearMovementKeys();

    player.connected = false;

    ui.classList.remove(
        "hidden"
    );

    hud.classList.remove(
        "visible"
    );

    controls.classList.remove(
        "visible"
    );

    roomButton.classList.remove(
        "visible"
    );
}


/* =========================================================
   UPDATE HUD
========================================================= */

function updateHUD() {

    let count = 1;

    if (isHost) {

        count =
            hostPlayers.size;

    } else {

        count =
            remotePlayers.size + 1;
    }

    hudInfo.textContent =
        `${isHost ? "Host" : "Connected"} · ${count} player${count === 1 ? "" : "s"}`;
}


/* =========================================================
   CREATE ROOM
========================================================= */

function createRoom() {

    const nameInput =
        document.getElementById("name");

    player.name =
        nameInput.value.trim() ||
        "Player";

    player.color =
        randomColor();

    roomCode =
        generateRoomCode();

    isHost = true;

    hostPeerId =
        "circle-world-" +
        roomCode.toLowerCase();

    setStatus(
        "Creating room..."
    );


    peer =
        new Peer(
            hostPeerId,
            {
                debug: 1
            }
        );


    peer.on(
        "open",
        id => {

            player.id =
                id;


            /*
                Add host player.
            */

            hostPlayers.set(
                player.id,
                {

                    id: player.id,

                    name: player.name,

                    x: player.x,

                    y: player.y,

                    vx: 0,

                    vy: 0,

                    radius: player.radius,

                    speed: player.speed,

                    sprintSpeed:
                        player.sprintSpeed,

                    color: player.color,

                    lastInputSequence: 0

                }
            );


            /*
                NOW the game begins.
            */

            enterGame();

            setStatus("");

            openRoomPopup();
        }
    );


    /*
        Other players connect here.
    */

    peer.on(
        "connection",
        connection => {

            setupHostConnection(
                connection
            );
        }
    );


    peer.on(
        "error",
        error => {

            console.error(error);

            if (
                error.type ===
                "unavailable-id"
            ) {

                setStatus(
                    "That room already exists. Try again."
                );

            } else {

                setStatus(
                    "Could not create room."
                );
            }

            isHost = false;
        }
    );
}


/* =========================================================
   HOST CONNECTION
========================================================= */

function setupHostConnection(
    connection
) {

    hostConnections.set(
        connection.peer,
        connection
    );


    connection.on(
        "open",
        () => {

            connection.send({

                type: "welcome",

                id: connection.peer,

                players:
                    Array
                        .from(
                            hostPlayers.values()
                        )
                        .map(p => ({
                            id: p.id,
                            name: p.name,
                            x: p.x,
                            y: p.y,
                            vx: p.vx,
                            vy: p.vy,
                            radius: p.radius,
                            color: p.color
                        }))

            });
        }
    );


    connection.on(
        "data",
        data => {

            if (
                !data ||
                typeof data !== "object"
            ) {
                return;
            }


            /*
                New player.
            */

            if (
                data.type === "join"
            ) {

                const spawnX =
                    WORLD.width / 2 +
                    (Math.random() - .5) *
                    500;

                const spawnY =
                    WORLD.height / 2 +
                    (Math.random() - .5) *
                    500;


                const newPlayer = {

                    id: connection.peer,

                    name:
                        String(
                            data.name ||
                            "Player"
                        ).slice(
                            0,
                            16
                        ),

                    x: spawnX,

                    y: spawnY,

                    vx: 0,

                    vy: 0,

                    radius: 30,

                    speed: 360,

                    sprintSpeed: 600,

                    color:
                        data.color ||
                        randomColor(),

                    lastInputSequence: 0
                };


                hostPlayers.set(
                    newPlayer.id,
                    newPlayer
                );

                hostInputs.set(
                    newPlayer.id,
                    []
                );


                /*
                    Tell new player where it spawned.
                */

                connection.send({

                    type: "spawn",

                    x: newPlayer.x,

                    y: newPlayer.y

                });


                /*
                    Tell everybody about it.
                */

                broadcast({

                    type: "playerJoined",

                    player: {

                        id: newPlayer.id,

                        name:
                            newPlayer.name,

                        x: newPlayer.x,

                        y: newPlayer.y,

                        vx: 0,

                        vy: 0,

                        radius:
                            newPlayer.radius,

                        color:
                            newPlayer.color
                    }
                });


                updateHUD();
            }


            /*
                Movement input.
            */

            if (
                data.type === "input"
            ) {

                const queue =
                    hostInputs.get(
                        connection.peer
                    );

                if (!queue) {
                    return;
                }


                /*
                    Keep queue safe.
                */

                if (
                    queue.length >= 15
                ) {
                    return;
                }


                queue.push({

                    sequence:
                        Number(
                            data.sequence
                        ) || 0,

                    x:
                        Math.max(
                            -1,
                            Math.min(
                                1,
                                Number(
                                    data.x
                                ) || 0
                            )
                        ),

                    y:
                        Math.max(
                            -1,
                            Math.min(
                                1,
                                Number(
                                    data.y
                                ) || 0
                            )
                        ),

                    shift:
                        !!data.shift
                });
            }

        }
    );


    connection.on(
        "close",
        () => {

            const id =
                connection.peer;


            hostPlayers.delete(id);

            hostInputs.delete(id);

            hostConnections.delete(id);


            broadcast({

                type: "playerLeft",

                id

            });


            updateHUD();
        }
    );
}


/* =========================================================
   BROADCAST
========================================================= */

function broadcast(
    message
) {

    for (
        const connection
        of hostConnections.values()
    ) {

        if (
            connection.open
        ) {

            try {

                connection.send(
                    message
                );

            } catch (error) {

                console.warn(
                    error
                );
            }
        }
    }
}


/* =========================================================
   HOST SIMULATION
========================================================= */

function hostSimulationTick(
    dt
) {

    if (!isHost) {
        return;
    }


    /*
        HOST PLAYER

        Host movement uses the actual
        keyboard.
    */

    const host =
        hostPlayers.get(
            player.id
        );

    if (host) {

        const input =
            getMovementInput();


        movePlayer(
            host,
            input,
            dt
        );


        /*
            Keep local player exactly
            equal to host authority.
        */

        player.x =
            host.x;

        player.y =
            host.y;

        player.vx =
            host.vx;

        player.vy =
            host.vy;
    }


    /*
        CLIENT PLAYERS

        The host processes their
        movement inputs.
    */

    for (
        const [id, remote]
        of hostPlayers
    ) {

        if (
            id === player.id
        ) {
            continue;
        }


        const queue =
            hostInputs.get(id);


        if (
            !queue ||
            queue.length === 0
        ) {
            continue;
        }


        /*
            Process every queued input.

            This makes the host the
            authoritative simulation.
        */

        while (
            queue.length > 0
        ) {

            const input =
                queue.shift();


            movePlayer(
                remote,
                input,
                1 / 60
            );


            remote.lastInputSequence =
                input.sequence;
        }
    }
}


/* =========================================================
   SNAPSHOT SERVER
========================================================= */

let snapshotTimer = 0;

function sendSnapshots(
    dt
) {

    if (!isHost) {
        return;
    }


    snapshotTimer += dt;


    /*
        30 snapshots per second.
    */

    if (
        snapshotTimer <
        1 / 30
    ) {
        return;
    }


    snapshotTimer = 0;


    const players =
        Array
            .from(
                hostPlayers.values()
            )
            .map(p => ({

                id: p.id,

                name: p.name,

                x: p.x,

                y: p.y,

                vx: p.vx,

                vy: p.vy,

                radius: p.radius,

                color: p.color,

                lastInputSequence:
                    p.lastInputSequence
            }));


    broadcast({

        type: "snapshot",

        players
    });
}


/* =========================================================
   JOIN ROOM
========================================================= */

function joinRoom() {

    const nameInput =
        document.getElementById(
            "name"
        );

    const roomInput =
        document.getElementById(
            "roomInput"
        );


    const name =
        nameInput.value.trim();

    const code =
        roomInput.value
            .trim()
            .toUpperCase();


    if (
        code.length !== 6
    ) {

        setStatus(
            "Enter a 6-character room code."
        );

        return;
    }


    player.name =
        name || "Player";

    player.color =
        randomColor();

    roomCode =
        code;

    isHost = false;


    setStatus(
        "Connecting..."
    );


    const targetPeer =
        "circle-world-" +
        code.toLowerCase();


    peer =
        new Peer({
            debug: 1
        });


    peer.on(
        "open",
        id => {

            player.id =
                id;


            clientConnection =
                peer.connect(
                    targetPeer,
                    {
                        reliable: true
                    }
                );


            clientConnection.on(
                "open",
                () => {

                    /*
                        Tell host we're joining.
                    */

                    clientConnection.send({

                        type: "join",

                        name:
                            player.name,

                        color:
                            player.color
                    });


                    /*
                        Now enter gameplay.
                    */

                    enterGame();
                }
            );


            clientConnection.on(
                "data",
                handleClientMessage
            );


            clientConnection.on(
                "close",
                () => {

                    clearMovementKeys();

                    leaveGame();

                    setStatus(
                        "Disconnected from room."
                    );
                }
            );


            clientConnection.on(
                "error",
                error => {

                    console.error(
                        error
                    );

                    setStatus(
                        "Connection failed."
                    );
                }
            );
        }
    );


    peer.on(
        "error",
        error => {

            console.error(error);

            setStatus(
                "Could not join that room."
            );
        }
    );
}


/* =========================================================
   CLIENT MESSAGE
========================================================= */

function handleClientMessage(
    data
) {

    if (
        !data ||
        typeof data !== "object"
    ) {
        return;
    }


    /*
        Welcome message.
    */

    if (
        data.type ===
        "welcome"
    ) {

        player.id =
            data.id;


        remotePlayers.clear();


        if (
            Array.isArray(
                data.players
            )
        ) {

            for (
                const p
                of data.players
            ) {

                if (
                    p.id ===
                    player.id
                ) {
                    continue;
                }


                remotePlayers.set(
                    p.id,
                    {

                        ...p,

                        targetX:
                            p.x,

                        targetY:
                            p.y
                    }
                );
            }
        }


        updateHUD();
    }


    /*
        Spawn position.
    */

    if (
        data.type ===
        "spawn"
    ) {

        player.x =
            data.x;

        player.y =
            data.y;

        player.vx = 0;
        player.vy = 0;


        camera.x =
            player.x;

        camera.y =
            player.y;
    }


    /*
        Somebody joined.
    */

    if (
        data.type ===
        "playerJoined"
    ) {

        const p =
            data.player;


        if (
            p.id !==
            player.id
        ) {

            remotePlayers.set(
                p.id,
                {

                    ...p,

                    targetX:
                        p.x,

                    targetY:
                        p.y
                }
            );
        }


        updateHUD();
    }


    /*
        Somebody left.
    */

    if (
        data.type ===
        "playerLeft"
    ) {

        remotePlayers.delete(
            data.id
        );

        updateHUD();
    }


    /*
        Server snapshot.
    */

    if (
        data.type ===
        "snapshot"
    ) {

        processSnapshot(
            data.players
        );
    }
}


/* =========================================================
   SNAPSHOT RECONCILIATION
========================================================= */

function processSnapshot(
    players
) {

    for (
        const serverPlayer
        of players
    ) {

        /*
            OUR PLAYER
        */

        if (
            serverPlayer.id ===
            player.id
        ) {

            const ack =
                Number(
                    serverPlayer
                        .lastInputSequence
                ) || 0;


            /*
                Remove inputs that
                server already processed.
            */

            player.pendingInputs =
                player.pendingInputs.filter(
                    input =>
                        input.sequence >
                        ack
                );


            /*
                Correct local player to
                authoritative server state.
            */

            player.x =
                serverPlayer.x;

            player.y =
                serverPlayer.y;

            player.vx =
                serverPlayer.vx;

            player.vy =
                serverPlayer.vy;


            /*
                Replay inputs that the
                server hasn't processed yet.

                This gives responsive
                client-side prediction.
            */

            for (
                const input
                of player.pendingInputs
            ) {

                movePlayer(
                    player,
                    input,
                    1 / 60
                );
            }


            continue;
        }


        /*
            OTHER PLAYER
        */

        let remote =
            remotePlayers.get(
                serverPlayer.id
            );


        if (!remote) {

            remote = {

                ...serverPlayer,

                targetX:
                    serverPlayer.x,

                targetY:
                    serverPlayer.y
            };


            remotePlayers.set(
                serverPlayer.id,
                remote
            );
        }


        remote.name =
            serverPlayer.name;

        remote.color =
            serverPlayer.color;

        remote.radius =
            serverPlayer.radius;

        remote.vx =
            serverPlayer.vx;

        remote.vy =
            serverPlayer.vy;


        remote.targetX =
            serverPlayer.x;

        remote.targetY =
            serverPlayer.y;
    }


    updateHUD();
}


/* =========================================================
   SEND CLIENT INPUT
========================================================= */

let inputTimer = 0;

function sendClientInput(
    dt
) {

    if (
        isHost ||
        !player.connected ||
        !clientConnection ||
        !clientConnection.open
    ) {

        return;
    }


    inputTimer += dt;


    /*
        Send 30 inputs per second.
    */

    if (
        inputTimer <
        1 / 30
    ) {
        return;
    }


    inputTimer = 0;


    const movement =
        getMovementInput();


    const input = {

        sequence:
            ++player.inputSequence,

        x:
            movement.x,

        y:
            movement.y,

        shift:
            movement.shift
    };


    /*
        Save input for reconciliation.
    */

    player.pendingInputs.push(
        input
    );


    /*
        Predict movement immediately.
    */

    movePlayer(
        player,
        input,
        1 / 30
    );


    /*
        Send to host.
    */

    try {

        clientConnection.send({

            type: "input",

            ...input

        });

    } catch (error) {

        console.warn(error);
    }
}


/* =========================================================
   UPDATE REMOTE PLAYERS
========================================================= */

function updateRemotePlayers(
    dt
) {

    for (
        const remote
        of remotePlayers.values()
    ) {

        /*
            Smooth interpolation.

            Remote players don't teleport.
        */

        const smoothing =
            Math.min(
                1,
                dt * 14
            );


        remote.x +=
            (
                remote.targetX -
                remote.x
            ) *
            smoothing;


        remote.y +=
            (
                remote.targetY -
                remote.y
            ) *
            smoothing;
    }
}


/* =========================================================
   CAMERA
========================================================= */

function updateCamera(
    dt
) {

    /*
        Camera follows player smoothly.
    */

    const smoothing =
        Math.min(
            1,
            dt * 9
        );


    camera.x +=
        (
            player.x -
            camera.x
        ) *
        smoothing;


    camera.y +=
        (
            player.y -
            camera.y
        ) *
        smoothing;


    /*
        Keep camera inside world.
    */

    const halfW =
        screenWidth / 2;

    const halfH =
        screenHeight / 2;


    if (
        WORLD.width <=
        screenWidth
    ) {

        camera.x =
            WORLD.width / 2;

    } else {

        camera.x =
            Math.max(
                halfW,
                Math.min(
                    WORLD.width - halfW,
                    camera.x
                )
            );
    }


    if (
        WORLD.height <=
        screenHeight
    ) {

        camera.y =
            WORLD.height / 2;

    } else {

        camera.y =
            Math.max(
                halfH,
                Math.min(
                    WORLD.height - halfH,
                    camera.y
                )
            );
    }
}


/* =========================================================
   DRAW WORLD
========================================================= */

function drawWorld() {

    /*
        ALWAYS draw background.
    */

    ctx.fillStyle =
        "#e8edf3";

    ctx.fillRect(
        0,
        0,
        screenWidth,
        screenHeight
    );


    /*
        Camera transform.
    */

    ctx.save();

    ctx.translate(
        screenWidth / 2 -
        camera.x,

        screenHeight / 2 -
        camera.y
    );


    /*
        World floor.
    */

    ctx.fillStyle =
        "#f1f4f8";

    ctx.fillRect(
        0,
        0,
        WORLD.width,
        WORLD.height
    );


    /*
        Small grid.
    */

    ctx.beginPath();

    ctx.lineWidth = 1;

    ctx.strokeStyle =
        "rgba(100,116,139,.10)";


    for (
        let x = 0;
        x <= WORLD.width;
        x += WORLD.grid
    ) {

        if (
            x % WORLD.majorGrid === 0
        ) {
            continue;
        }

        ctx.moveTo(
            x,
            0
        );

        ctx.lineTo(
            x,
            WORLD.height
        );
    }


    for (
        let y = 0;
        y <= WORLD.height;
        y += WORLD.grid
    ) {

        if (
            y % WORLD.majorGrid === 0
        ) {
            continue;
        }

        ctx.moveTo(
            0,
            y
        );

        ctx.lineTo(
            WORLD.width,
            y
        );
    }

    ctx.stroke();


    /*
        Major grid.
    */

    ctx.beginPath();

    ctx.lineWidth =
        1.5;

    ctx.strokeStyle =
        "rgba(71,85,105,.16)";


    for (
        let x = 0;
        x <= WORLD.width;
        x += WORLD.majorGrid
    ) {

        ctx.moveTo(
            x,
            0
        );

        ctx.lineTo(
            x,
            WORLD.height
        );
    }


    for (
        let y = 0;
        y <= WORLD.height;
        y += WORLD.majorGrid
    ) {

        ctx.moveTo(
            0,
            y
        );

        ctx.lineTo(
            WORLD.width,
            y
        );
    }

    ctx.stroke();


    /*
        World border.
    */

    ctx.strokeStyle =
        "rgba(15,23,42,.32)";

    ctx.lineWidth = 7;

    ctx.strokeRect(
        0,
        0,
        WORLD.width,
        WORLD.height
    );


    ctx.restore();
}


/* =========================================================
   DRAW PLAYER
========================================================= */

function drawPlayer(
    p,
    local
) {

    const x =
        p.x -
        camera.x +
        screenWidth / 2;

    const y =
        p.y -
        camera.y +
        screenHeight / 2;

    const radius =
        p.radius || 30;


    /*
        Shadow.
    */

    ctx.beginPath();

    ctx.ellipse(
        x,
        y + radius * .75,
        radius * .95,
        radius * .30,
        0,
        0,
        Math.PI * 2
    );

    ctx.fillStyle =
        "rgba(15,23,42,.16)";

    ctx.fill();


    /*
        Outer glow for local player.
    */

    if (local) {

        ctx.beginPath();

        ctx.arc(
            x,
            y,
            radius + 9,
            0,
            Math.PI * 2
        );

        ctx.fillStyle =
            "rgba(59,130,246,.13)";

        ctx.fill();
    }


    /*
        Main circle gradient.
    */

    const gradient =
        ctx.createRadialGradient(
            x - radius * .35,
            y - radius * .4,
            radius * .08,

            x,
            y,
            radius
        );


    gradient.addColorStop(
        0,
        "#ffffff"
    );

    gradient.addColorStop(
        .13,
        p.color
    );

    gradient.addColorStop(
        1,
        darkenColor(
            p.color,
            .72
        )
    );


    ctx.beginPath();

    ctx.arc(
        x,
        y,
        radius,
        0,
        Math.PI * 2
    );

    ctx.fillStyle =
        gradient;

    ctx.fill();


    /*
        Border.
    */

    ctx.lineWidth = 2;

    ctx.strokeStyle =
        "rgba(15,23,42,.24)";

    ctx.stroke();


    /*
        Highlight.
    */

    ctx.beginPath();

    ctx.arc(
        x - radius * .31,
        y - radius * .35,
        radius * .18,
        0,
        Math.PI * 2
    );

    ctx.fillStyle =
        "rgba(255,255,255,.62)";

    ctx.fill();


    /*
        Nameplate.
    */

    drawNameplate(
        p.name || "Player",
        x,
        y - radius - 15,
        local
    );
}


/* =========================================================
   NAMEPLATE
========================================================= */

function drawNameplate(
    name,
    x,
    y,
    local
) {

    ctx.save();

    ctx.font =
        "700 12px Arial, sans-serif";

    const textWidth =
        ctx.measureText(
            name
        ).width;

    const width =
        textWidth + 18;

    const height = 22;


    /*
        Background.
    */

    roundRect(
        ctx,
        x - width / 2,
        y - height / 2,
        width,
        height,
        8
    );

    ctx.fillStyle =
        "rgba(255,255,255,.9)";

    ctx.fill();


    /*
        Text.
    */

    ctx.fillStyle =
        local
            ? "#2563eb"
            : "#334155";

    ctx.textAlign =
        "center";

    ctx.textBaseline =
        "middle";

    ctx.fillText(
        name,
        x,
        y
    );


    ctx.restore();
}


/* =========================================================
   ROUND RECT
========================================================= */

function roundRect(
    context,
    x,
    y,
    width,
    height,
    radius
) {

    context.beginPath();

    context.moveTo(
        x + radius,
        y
    );

    context.arcTo(
        x + width,
        y,
        x + width,
        y + height,
        radius
    );

    context.arcTo(
        x + width,
        y + height,
        x,
        y + height,
        radius
    );

    context.arcTo(
        x,
        y + height,
        x,
        y,
        radius
    );

    context.arcTo(
        x,
        y,
        x + width,
        y,
        radius
    );

    context.closePath();
}


/* =========================================================
   DARKEN COLOR
========================================================= */

function darkenColor(
    hex,
    factor
) {

    let value =
        hex.replace(
            "#",
            ""
        );

    if (
        value.length === 3
    ) {

        value =
            value
                .split("")
                .map(x => x + x)
                .join("");
    }


    const r =
        parseInt(
            value.substring(0, 2),
            16
        );

    const g =
        parseInt(
            value.substring(2, 4),
            16
        );

    const b =
        parseInt(
            value.substring(4, 6),
            16
        );


    return "#" +
        Math.floor(
            r * factor
        )
        .toString(16)
        .padStart(2, "0") +

        Math.floor(
            g * factor
        )
        .toString(16)
        .padStart(2, "0") +

        Math.floor(
            b * factor
        )
        .toString(16)
        .padStart(2, "0");
}


/* =========================================================
   RENDER
========================================================= */

function render() {

    /*
        Clear canvas.
    */

    ctx.clearRect(
        0,
        0,
        screenWidth,
        screenHeight
    );


    /*
        World.
    */

    drawWorld();


    /*
        Remote players first.
    */

    for (
        const remote
        of remotePlayers.values()
    ) {

        drawPlayer(
            remote,
            false
        );
    }


    /*
        Local player last.
    */

    drawPlayer(
        player,
        true
    );


    /*
        Subtle vignette.
    */

    const gradient =
        ctx.createRadialGradient(
            screenWidth / 2,
            screenHeight / 2,
            Math.min(
                screenWidth,
                screenHeight
            ) * .2,

            screenWidth / 2,
            screenHeight / 2,
            Math.max(
                screenWidth,
                screenHeight
            ) * .75
        );


    gradient.addColorStop(
        0,
        "rgba(255,255,255,0)"
    );

    gradient.addColorStop(
        1,
        "rgba(15,23,42,.08)"
    );


    ctx.fillStyle =
        gradient;

    ctx.fillRect(
        0,
        0,
        screenWidth,
        screenHeight
    );
}

   ROOM POPUP

    event => {

        event.target.value =
            event.target.value
                .replace(
                    /[^a-zA-Z0-9]/g,

                )

                );
    }
);


document.getElementById(
    "roomInput"
).addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Enter"
        ) {

            event.preventDefault();

            joinRoom();
        }
    }
);


/* =========================================================
   GAME LOOP
========================================================= */

let lastTime =
    performance.now();

let accumulator = 0;

const FIXED_DT =
    1 / 60;


function gameLoop(
    currentTime
) {

    let delta =
        (
            currentTime -
            lastTime
        ) / 1000;


    lastTime =
        currentTime;


    /*
        Prevent huge movement after
        tab switching.
    */

    delta =
        Math.min(
            delta,
            .1
        );


    accumulator +=
        delta;


    /*
        Fixed physics.
    */

    while (
        accumulator >=
        FIXED_DT
    ) {

        /*
            NOTHING MOVES UNTIL
            PLAYER IS CONNECTED.
        */

        if (
            player.connected
        ) {

            if (
                isHost
            ) {

                hostSimulationTick(
                    FIXED_DT
                );

            } else {

                sendClientInput(
                    FIXED_DT
                );
            }
        }


        accumulator -=
            FIXED_DT;
    }


    /*
        Multiplayer interpolation.
    */

    updateRemotePlayers(
        delta
    );


    /*
        Camera follows player.
    */

    updateCamera(
        delta
    );


    /*
        Draw everything.
    */

    render();


    requestAnimationFrame(
        gameLoop
    );
}


/* =========================================================
   INITIALIZATION
========================================================= */

/*
    IMPORTANT:

    Draw the world immediately,
    before PeerJS does anything.

    So the page can NEVER start
    as a black canvas.
*/

camera.x =
    player.x;

camera.y =
    player.y;


render();


requestAnimationFrame(
    gameLoop
);
