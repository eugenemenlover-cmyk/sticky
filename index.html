<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Circle World Multiplayer</title>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #090b10;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    color: white;
}

canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    background: #11151c;
}

/* =========================================================
   SCREENS
========================================================= */

.screen {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: none;
    align-items: center;
    justify-content: center;
    pointer-events: none;
}

.screen.active {
    display: flex;
    pointer-events: auto;
}

/* =========================================================
   MAIN MENU
========================================================= */

#menuScreen {
    background:
        radial-gradient(circle at 50% 40%, rgba(90, 110, 255, 0.15), transparent 40%),
        rgba(5, 7, 11, 0.88);
}

.menu-box {
    width: min(440px, calc(100vw - 40px));
    text-align: center;
}

.logo {
    font-size: clamp(48px, 8vw, 82px);
    font-weight: 900;
    letter-spacing: -5px;
    line-height: 0.95;
    text-shadow:
        0 0 30px rgba(100, 120, 255, 0.3),
        0 8px 40px rgba(0,0,0,0.5);
}

.logo span {
    color: #7084ff;
}

.logo-subtitle {
    margin-top: 16px;
    color: #8992a5;
    font-size: 14px;
    letter-spacing: 3px;
    text-transform: uppercase;
}

.menu-buttons {
    margin-top: 45px;
}

.menu-button {
    width: 100%;
    height: 58px;
    margin-bottom: 12px;
    border: 0;
    border-radius: 14px;
    color: white;
    background: #6276ff;
    font-size: 16px;
    font-weight: 800;
    letter-spacing: 1px;
    cursor: pointer;
    transition:
        transform 0.15s ease,
        background 0.15s ease,
        box-shadow 0.15s ease;
    box-shadow: 0 12px 35px rgba(70, 85, 220, 0.2);
}

.menu-button:hover {
    transform: translateY(-2px);
    background: #7183ff;
    box-shadow: 0 15px 40px rgba(70, 85, 220, 0.3);
}

.menu-button:active {
    transform: translateY(0);
}

.menu-button.secondary {
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.1);
    box-shadow: none;
}

.menu-button.secondary:hover {
    background: rgba(255,255,255,0.11);
}

/* =========================================================
   MATCHMAKING
========================================================= */

#matchScreen {
    background:
        radial-gradient(circle at 50% 30%, rgba(80, 100, 255, 0.12), transparent 45%),
        rgba(5, 7, 11, 0.92);
}

.match-box {
    width: min(430px, calc(100vw - 30px));
    padding: 30px;
    border-radius: 22px;

    background: rgba(16, 20, 29, 0.96);
    border: 1px solid rgba(255,255,255,0.09);

    box-shadow:
        0 30px 80px rgba(0,0,0,0.55),
        inset 0 1px rgba(255,255,255,0.04);

    backdrop-filter: blur(20px);
}

.match-title {
    font-size: 30px;
    font-weight: 900;
    margin-bottom: 7px;
}

.match-subtitle {
    color: #8790a3;
    font-size: 13px;
    margin-bottom: 25px;
}

.field-label {
    display: block;
    margin: 0 0 7px 2px;
    color: #aeb5c5;
    font-size: 12px;
    font-weight: 700;
}

input {
    width: 100%;
    height: 48px;
    margin-bottom: 15px;
    padding: 0 14px;

    border: 1px solid #303747;
    border-radius: 11px;
    outline: none;

    background: #1b202b;
    color: white;

    font-size: 14px;

    transition:
        border 0.15s,
        box-shadow 0.15s;
}

input::placeholder {
    color: #697184;
}

input:focus {
    border-color: #7184ff;
    box-shadow: 0 0 0 3px rgba(113,132,255,0.12);
}

.action-button {
    width: 100%;
    height: 48px;
    margin-bottom: 10px;

    border: 0;
    border-radius: 11px;

    color: white;
    background: #6276ff;

    font-size: 14px;
    font-weight: 800;

    cursor: pointer;

    transition:
        transform 0.15s,
        background 0.15s;
}

.action-button:hover {
    background: #7183ff;
    transform: translateY(-1px);
}

.action-button.secondary {
    background: #292f3c;
}

.action-button.secondary:hover {
    background: #343c4a;
}

.back-button {
    margin-top: 8px;
    width: 100%;
    height: 42px;

    border: 0;
    background: transparent;
    color: #737d90;

    cursor: pointer;
    font-size: 13px;
}

.back-button:hover {
    color: white;
}

/* =========================================================
   WAITING ROOM
========================================================= */

#waitingScreen {
    background:
        radial-gradient(circle at 50% 35%, rgba(80, 100, 255, 0.12), transparent 45%),
        rgba(5, 7, 11, 0.93);
}

.waiting-box {
    width: min(450px, calc(100vw - 30px));
    padding: 32px;

    text-align: center;

    background: rgba(16,20,29,0.97);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 22px;

    box-shadow: 0 30px 80px rgba(0,0,0,0.55);
}

.waiting-title {
    font-size: 28px;
    font-weight: 900;
}

.waiting-subtitle {
    margin-top: 8px;
    color: #858ea1;
    font-size: 13px;
}

.room-code {
    margin: 25px 0 15px;

    padding: 18px;

    border-radius: 14px;
    border: 1px solid rgba(113,132,255,0.25);

    background: rgba(98,118,255,0.08);

    color: #8d9cff;

    font-size: 32px;
    font-weight: 900;
    letter-spacing: 7px;
}

.waiting-status {
    margin: 15px 0 22px;
    color: #9aa3b5;
    font-size: 13px;
}

.player-count {
    margin-bottom: 20px;
    padding: 12px;

    border-radius: 10px;
    background: rgba(255,255,255,0.04);

    color: #c8ceda;
    font-size: 13px;
}

.copy-button {
    background: #292f3c;
}

.enter-button {
    background: #6276ff;
}

.leave-button {
    background: transparent;
    color: #7d8697;
}

/* =========================================================
   HOW TO PLAY
========================================================= */

#howScreen {
    background: rgba(5,7,11,0.92);
}

.how-box {
    width: min(500px, calc(100vw - 30px));
    padding: 32px;

    background: rgba(16,20,29,0.97);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 22px;

    box-shadow: 0 30px 80px rgba(0,0,0,0.55);
}

.how-title {
    font-size: 28px;
    font-weight: 900;
    margin-bottom: 22px;
}

.control-row {
    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 14px 0;

    border-bottom: 1px solid rgba(255,255,255,0.06);
}

.control-name {
    color: #bfc6d5;
}

.keys {
    display: flex;
    gap: 5px;
}

.key {
    min-width: 34px;
    padding: 7px 9px;

    text-align: center;

    border-radius: 7px;
    background: #252b38;
    border: 1px solid #363d4d;

    color: white;
    font-weight: 800;
    font-size: 12px;
}

/* =========================================================
   GAME UI
========================================================= */

#gameUI {
    position: fixed;
    inset: 0;
    z-index: 20;

    pointer-events: none;

    display: none;
}

#gameUI.active {
    display: block;
}

.hud {
    position: absolute;
    top: 18px;
    left: 18px;

    padding: 13px 16px;

    border-radius: 13px;

    background: rgba(12,15,21,0.82);
    border: 1px solid rgba(255,255,255,0.08);

    backdrop-filter: blur(10px);

    font-size: 13px;
}

.hud-name {
    font-weight: 800;
}

.hud-room {
    margin-top: 4px;
    color: #838da0;
    font-size: 11px;
}

.controls {
    position: absolute;
    right: 18px;
    bottom: 18px;

    padding: 11px 15px;

    border-radius: 11px;

    background: rgba(12,15,21,0.82);
    border: 1px solid rgba(255,255,255,0.08);

    color: #9aa3b4;

    font-size: 12px;
}

.controls b {
    color: white;
}

/* =========================================================
   NOTIFICATION
========================================================= */

#message {
    position: fixed;
    top: 22px;
    left: 50%;

    z-index: 500;

    transform: translateX(-50%) translateY(-10px);

    padding: 11px 18px;

    border-radius: 10px;

    background: rgba(12,15,21,0.94);
    border: 1px solid rgba(255,255,255,0.1);

    color: white;

    font-size: 13px;

    opacity: 0;
    pointer-events: none;

    transition:
        opacity 0.2s,
        transform 0.2s;
}

#message.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
}

/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 600px) {

    .match-box,
    .waiting-box,
    .how-box {
        padding: 24px;
    }

    .room-code {
        font-size: 27px;
    }

    .controls {
        right: 10px;
        bottom: 10px;
        font-size: 10px;
    }

    .hud {
        top: 10px;
        left: 10px;
    }
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<!-- =========================================================
     MAIN MENU
========================================================= -->

<div id="menuScreen" class="screen active">

    <div class="menu-box">

        <div class="logo">
            CIRCLE<span>WORLD</span>
        </div>

        <div class="logo-subtitle">
            Multiplayer World
        </div>

        <div class="menu-buttons">

            <button
                type="button"
                id="playBtn"
                class="menu-button">
                PLAY
            </button>

            <button
                type="button"
                id="howBtn"
                class="menu-button secondary">
                HOW TO PLAY
            </button>

        </div>

    </div>

</div>

<!-- =========================================================
     MATCHMAKING
========================================================= -->

<div id="matchScreen" class="screen">

    <div class="match-box">

        <div class="match-title">
            Matchmaking
        </div>

        <div class="match-subtitle">
            Create a room or join one with a code.
        </div>

        <label class="field-label">
            PLAYER NAME
        </label>

        <input
            id="nameInput"
            type="text"
            maxlength="16"
            autocomplete="off"
            placeholder="Enter your name">

        <button
            type="button"
            id="createBtn"
            class="action-button">
            CREATE ROOM
        </button>

        <label class="field-label" style="margin-top: 10px;">
            ROOM CODE
        </label>

        <input
            id="roomInput"
            type="text"
            maxlength="12"
            autocomplete="off"
            placeholder="Enter room code">

        <button
            type="button"
            id="joinBtn"
            class="action-button secondary">
            JOIN ROOM
        </button>

        <button
            type="button"
            id="matchBackBtn"
            class="back-button">
            ← Back to Main Menu
        </button>

    </div>

</div>

<!-- =========================================================
     WAITING ROOM
========================================================= -->

<div id="waitingScreen" class="screen">

    <div class="waiting-box">

        <div class="waiting-title">
            Room Created
        </div>

        <div class="waiting-subtitle">
            Send this code to your friend.
        </div>

        <div
            id="roomCodeDisplay"
            class="room-code">
            ------
        </div>

        <button
            type="button"
            id="copyBtn"
            class="action-button copy-button">
            COPY ROOM CODE
        </button>

        <div
            id="waitingStatus"
            class="waiting-status">
            Waiting for players...
        </div>

        <div
            id="playerCount"
            class="player-count">
            Players: 1
        </div>

        <button
            type="button"
            id="enterGameBtn"
            class="action-button enter-button">
            ENTER GAME
        </button>

        <button
            type="button"
            id="leaveRoomBtn"
            class="action-button leave-button">
            LEAVE ROOM
        </button>

    </div>

</div>

<!-- =========================================================
     HOW TO PLAY
========================================================= -->

<div id="howScreen" class="screen">

    <div class="how-box">

        <div class="how-title">
            How To Play
        </div>

        <div class="control-row">
            <div class="control-name">
                Move
            </div>

            <div class="keys">
                <div class="key">W</div>
                <div class="key">A</div>
                <div class="key">S</div>
                <div class="key">D</div>
            </div>
        </div>

        <div class="control-row">
            <div class="control-name">
                Sprint
            </div>

            <div class="keys">
                <div class="key">SHIFT</div>
            </div>
        </div>

        <div class="control-row">
            <div class="control-name">
                Multiplayer
            </div>

            <div style="color:#858ea1;font-size:12px;">
                Create or join a room
            </div>
        </div>

        <button
            type="button"
            id="howBackBtn"
            class="action-button secondary"
            style="margin-top:22px;">
            BACK
        </button>

    </div>

</div>

<!-- =========================================================
     GAME UI
========================================================= -->

<div id="gameUI">

    <div class="hud">

        <div
            id="hudName"
            class="hud-name">
            Player
        </div>

        <div
            id="hudRoom"
            class="hud-room">
            Room: ------
        </div>

    </div>

    <div class="controls">
        <b>W A S D</b> Move
        &nbsp; • &nbsp;
        <b>SHIFT</b> Sprint
    </div>

</div>

<div id="message"></div>

<script>
/* =========================================================
   CANVAS
========================================================= */

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let width = window.innerWidth;
let height = window.innerHeight;
let dpr = 1;

function resize() {

    width = window.innerWidth;
    height = window.innerHeight;

    dpr = Math.min(window.devicePixelRatio || 1, 2);

    canvas.width = Math.floor(width * dpr);
    canvas.height = Math.floor(height * dpr);

    canvas.style.width = width + "px";
    canvas.style.height = height + "px";

    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );
}

window.addEventListener("resize", resize);
resize();

/* =========================================================
   DOM
========================================================= */

const menuScreen = document.getElementById("menuScreen");
const matchScreen = document.getElementById("matchScreen");
const waitingScreen = document.getElementById("waitingScreen");
const howScreen = document.getElementById("howScreen");

const gameUI = document.getElementById("gameUI");

const playBtn = document.getElementById("playBtn");
const howBtn = document.getElementById("howBtn");

const howBackBtn = document.getElementById("howBackBtn");
const matchBackBtn = document.getElementById("matchBackBtn");

const nameInput = document.getElementById("nameInput");
const roomInput = document.getElementById("roomInput");

const createBtn = document.getElementById("createBtn");
const joinBtn = document.getElementById("joinBtn");

const roomCodeDisplay =
    document.getElementById("roomCodeDisplay");

const copyBtn =
    document.getElementById("copyBtn");

const waitingStatus =
    document.getElementById("waitingStatus");

const playerCount =
    document.getElementById("playerCount");

const enterGameBtn =
    document.getElementById("enterGameBtn");

const leaveRoomBtn =
    document.getElementById("leaveRoomBtn");

const hudName =
    document.getElementById("hudName");

const hudRoom =
    document.getElementById("hudRoom");

const message =
    document.getElementById("message");

/* =========================================================
   SCREEN MANAGEMENT
========================================================= */

const screens = [
    menuScreen,
    matchScreen,
    waitingScreen,
    howScreen
];

function showScreen(screen) {

    for (const s of screens) {
        s.classList.remove("active");
    }

    screen.classList.add("active");
}

function showGame() {

    for (const s of screens) {
        s.classList.remove("active");
    }

    gameUI.classList.add("active");

    gameStarted = true;

    hudName.textContent = player.name;
    hudRoom.textContent =
        "Room: " + (currentRoom || "------");

    clearKeys();
}

function hideGame() {

    gameUI.classList.remove("active");

    gameStarted = false;

    clearKeys();
}

/* =========================================================
   MAIN MENU BUTTONS
========================================================= */

playBtn.addEventListener("click", function(e) {

    e.preventDefault();
    e.stopPropagation();

    hideGame();

    showScreen(matchScreen);

    setTimeout(() => {
        nameInput.focus();
    }, 50);
});

howBtn.addEventListener("click", function(e) {

    e.preventDefault();
    e.stopPropagation();

    showScreen(howScreen);
});

howBackBtn.addEventListener("click", function(e) {

    e.preventDefault();
    e.stopPropagation();

    showScreen(menuScreen);
});

matchBackBtn.addEventListener("click", function(e) {

    e.preventDefault();
    e.stopPropagation();

    resetMultiplayer();

    showScreen(menuScreen);
});

/* =========================================================
   WORLD
========================================================= */

const world = {
    width: 5000,
    height: 5000,
    gridSize: 100
};

/* =========================================================
   COLORS
========================================================= */

function randomColor() {

    const colors = [
        "#6f82ff",
        "#ff657a",
        "#5dd6a0",
        "#f4bd58",
        "#b778ff",
        "#4dc8e8",
        "#ff8c52",
        "#e66bff"
    ];

    return colors[
        Math.floor(Math.random() * colors.length)
    ];
}

/* =========================================================
   PLAYER
========================================================= */

const player = {

    id: null,

    name: "Player",

    x: world.width / 2,
    y: world.height / 2,

    vx: 0,
    vy: 0,

    radius: 28,

    speed: 330,
    sprintSpeed: 520,

    color: randomColor()
};

const remotePlayers = new Map();

let camera = {
    x: player.x,
    y: player.y
};

/* =========================================================
   GAME STATE
========================================================= */

let gameStarted = false;

const keys = {};

function clearKeys() {

    for (const key in keys) {
        keys[key] = false;
    }
}

/* =========================================================
   INPUT
========================================================= */

function isTypingTarget(target) {

    if (!target) {
        return false;
    }

    const tag =
        target.tagName
            ? target.tagName.toLowerCase()
            : "";

    return (
        tag === "input" ||
        tag === "textarea" ||
        tag === "select" ||
        target.isContentEditable
    );
}

window.addEventListener("keydown", function(e) {

    const key = e.key.toLowerCase();

    /*
       VERY IMPORTANT:
       WASD does absolutely nothing while
       typing in matchmaking inputs.
    */

    if (isTypingTarget(e.target)) {
        return;
    }

    if (!gameStarted) {
        return;
    }

    if (
        key === "w" ||
        key === "a" ||
        key === "s" ||
        key === "d" ||
        key === "shift"
    ) {

        e.preventDefault();

        keys[key] = true;
    }
});

window.addEventListener("keyup", function(e) {

    const key = e.key.toLowerCase();

    if (
        key === "w" ||
        key === "a" ||
        key === "s" ||
        key === "d" ||
        key === "shift"
    ) {
        keys[key] = false;
    }
});

window.addEventListener("blur", clearKeys);

/* =========================================================
   MESSAGE
========================================================= */

let messageTimer = null;

function showMessage(text) {

    message.textContent = text;
    message.classList.add("show");

    clearTimeout(messageTimer);

    messageTimer = setTimeout(() => {
        message.classList.remove("show");
    }, 2500);
}

/* =========================================================
   PEERJS
========================================================= */

let peer = null;
let isHost = false;
let currentRoom = null;

const connections = new Map();

function generateRoomCode() {

    const chars =
        "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

    let code = "";

    for (let i = 0; i < 6; i++) {

        code +=
            chars[
                Math.floor(
                    Math.random() * chars.length
                )
            ];
    }

    return code;
}

function makeHostId(room) {

    return "circle-world-" +
        room.toLowerCase();
}

function makePlayerId() {

    return "circle-player-" +
        Math.random()
            .toString(36)
            .slice(2, 12) +
        "-" +
        Date.now().toString(36);
}

/* =========================================================
   INITIALIZE PEER
========================================================= */

function initializePeer(peerId, callback) {

    if (peer) {

        try {
            peer.destroy();
        } catch (err) {}
    }

    peer = new Peer(peerId);

    peer.on("open", function(id) {

        player.id = id;

        if (callback) {
            callback();
        }
    });

    peer.on("connection", function(connection) {

        /*
           Only the room host accepts incoming players.
        */

        if (!isHost) {
            return;
        }

        setupConnection(connection);
    });

    peer.on("error", function(err) {

        console.error("PeerJS error:", err);

        if (err.type === "unavailable-id") {

            waitingStatus.textContent =
                "That room already exists.";

            showMessage(
                "That room code is already being used."
            );

        } else if (err.type === "peer-unavailable") {

            showMessage(
                "Room not found."
            );

            waitingStatus.textContent =
                "Room not found.";

        } else {

            showMessage(
                "Connection error: " +
                err.type
            );

            waitingStatus.textContent =
                "Connection error.";
        }
    });

    peer.on("disconnected", function() {

        if (gameStarted) {

            showMessage(
                "Disconnected from multiplayer."
            );
        }
    });
}

/* =========================================================
   CREATE ROOM
========================================================= */

createBtn.addEventListener("click", function(e) {

    e.preventDefault();
    e.stopPropagation();

    createRoom();
});

function createRoom() {

    const name =
        nameInput.value.trim().slice(0, 16);

    player.name =
        name || "Player";

    const code =
        generateRoomCode();

    currentRoom = code;
    isHost = true;

    roomCodeDisplay.textContent = code;

    waitingStatus.textContent =
        "Creating room...";

    playerCount.textContent =
        "Players: 1";

    /*
       Go from MATCHMAKING to WAITING ROOM.
       The matchmaking screen remains intact.
    */

    showScreen(waitingScreen);

    initializePeer(
        makeHostId(code),
        function() {

            waitingStatus.textContent =
                "Room ready. Waiting for players...";

            showMessage(
                "Room created: " + code
            );
        }
    );
}

/* =========================================================
   JOIN ROOM
========================================================= */

joinBtn.addEventListener("click", function(e) {

    e.preventDefault();
    e.stopPropagation();

    joinRoom();
});

function joinRoom() {

    const code =
        roomInput.value
            .trim()
            .toUpperCase();

    if (code.length < 4) {

        showMessage(
            "Enter a valid room code."
        );

        roomInput.focus();

        return;
    }

    player.name =
        nameInput.value.trim().slice(0, 16)
        || "Player";

    currentRoom = code;
    isHost = false;

    waitingStatus.textContent =
        "Connecting...";

    roomCodeDisplay.textContent =
        code;

    playerCount.textContent =
        "Connecting...";

    /*
       Show the waiting/joining screen while
       the connection is being established.
    */

    showScreen(waitingScreen);

    const ownId =
        makePlayerId();

    initializePeer(
        ownId,
        function() {

            connectToHost(
                makeHostId(code)
            );
        }
    );
}

/* =========================================================
   CONNECT TO HOST
========================================================= */

function connectToHost(hostId) {

    if (!peer) {
        return;
    }

    waitingStatus.textContent =
        "Connecting to room...";

    const connection =
        peer.connect(
            hostId,
            {
                reliable: true
            }
        );

    connections.set(
        "host",
        connection
    );

    connection.on("open", function() {

        waitingStatus.textContent =
            "Connected! Entering game...";

        sendToConnection(
            connection,
            {
                type: "hello",

                id: player.id,

                name: player.name,

                x: player.x,
                y: player.y,

                vx: player.vx,
                vy: player.vy,

                color: player.color
            }
        );

        /*
           JOINER goes into the game after
           the room connection succeeds.
        */

        setTimeout(() => {

            showGame();

            showMessage(
                "Joined room!"
            );

        }, 350);
    });

    connection.on("error", function(err) {

        console.error(err);

        waitingStatus.textContent =
            "Could not connect to room.";

        showMessage(
            "Could not join that room."
        );
    });
}

/* =========================================================
   CONNECTION SETUP
========================================================= */

function setupConnection(connection) {

    connection.on("data", function(data) {

        if (!data || !data.type) {
            return;
        }

        /* -------------------------------------------------
           HELLO
        ------------------------------------------------- */

        if (data.type === "hello") {

            if (!data.id) {
                return;
            }

            const remote = {

                id: data.id,

                name:
                    data.name ||
                    "Player",

                x:
                    Number(data.x) ||
                    world.width / 2,

                y:
                    Number(data.y) ||
                    world.height / 2,

                targetX:
                    Number(data.x) ||
                    world.width / 2,

                targetY:
                    Number(data.y) ||
                    world.height / 2,

                vx: 0,
                vy: 0,

                color:
                    data.color ||
                    randomColor(),

                radius: 28
            };

            remotePlayers.set(
                data.id,
                remote
            );

            connections.set(
                data.id,
                connection
            );

            if (isHost) {

                /*
                   Send existing players to
                   the new player.
                */

                for (
                    const p of remotePlayers.values()
                ) {

                    if (p.id === data.id) {
                        continue;
                    }

                    sendToConnection(
                        connection,
                        {
                            type: "playerJoined",

                            player: {
                                id: p.id,
                                name: p.name,
                                x: p.x,
                                y: p.y,
                                color: p.color
                            }
                        }
                    );
                }

                /*
                   Tell everyone else about
                   the new player.
                */

                broadcast(
                    {
                        type: "playerJoined",

                        player: {
                            id: data.id,
                            name: data.name,
                            x: data.x,
                            y: data.y,
                            color: data.color
                        }
                    },
                    data.id
                );

                /*
                   Send room information to
                   the new player.
                */

                sendToConnection(
                    connection,
                    {
                        type: "roomReady"
                    }
                );

                updatePlayerCount();
            }

            return;
        }

        /* -------------------------------------------------
           ROOM READY
        ------------------------------------------------- */

        if (data.type === "roomReady") {

            if (!gameStarted) {

                setTimeout(() => {

                    showGame();

                    showMessage(
                        "Joined room!"
                    );

                }, 200);
            }

            return;
        }

        /* -------------------------------------------------
           PLAYER JOINED
        ------------------------------------------------- */

        if (data.type === "playerJoined") {

            const p =
                data.player;

            if (
                !p ||
                p.id === player.id
            ) {
                return;
            }

            remotePlayers.set(
                p.id,
                {
                    id: p.id,
                    name: p.name || "Player",

                    x: p.x,
                    y: p.y,

                    targetX: p.x,
                    targetY: p.y,

                    vx: 0,
                    vy: 0,

                    color:
                        p.color ||
                        randomColor(),

                    radius: 28
                }
            );

            updatePlayerCount();

            return;
        }

        /* -------------------------------------------------
           POSITION UPDATE
        ------------------------------------------------- */

        if (data.type === "update") {

            if (
                !data.id ||
                data.id === player.id
            ) {
                return;
            }

            let p =
                remotePlayers.get(
                    data.id
                );

            if (!p) {

                p = {

                    id: data.id,

                    name:
                        data.name ||
                        "Player",

                    x:
                        Number(data.x) || 0,

                    y:
                        Number(data.y) || 0,

                    targetX:
                        Number(data.x) || 0,

                    targetY:
                        Number(data.y) || 0,

                    vx:
                        Number(data.vx) || 0,

                    vy:
                        Number(data.vy) || 0,

                    color:
                        data.color ||
                        randomColor(),

                    radius: 28
                };

                remotePlayers.set(
                    data.id,
                    p
                );
            }

            p.targetX =
                Number(data.x) || 0;

            p.targetY =
                Number(data.y) || 0;

            p.vx =
                Number(data.vx) || 0;

            p.vy =
                Number(data.vy) || 0;

            if (data.name) {
                p.name = data.name;
            }

            if (data.color) {
                p.color = data.color;
            }

            /*
               Host relays player movement
               to every other player.
            */

            if (isHost) {

                broadcast(
                    data,
                    data.id
                );
            }

            return;
        }

        /* -------------------------------------------------
           PLAYER LEFT
        ------------------------------------------------- */

        if (data.type === "playerLeft") {

            remotePlayers.delete(
                data.id
            );

            connections.delete(
                data.id
            );

            updatePlayerCount();

            return;
        }
    });

    connection.on("close", function() {

        for (
            const [id, c]
            of connections
        ) {

            if (c === connection) {

                connections.delete(id);

                remotePlayers.delete(id);

                break;
            }
        }

        updatePlayerCount();
    });
}

/* =========================================================
   SEND
========================================================= */

function sendToConnection(
    connection,
    data
) {

    if (
        !connection ||
        !connection.open
    ) {
        return;
    }

    try {

        connection.send(data);

    } catch (err) {

        console.error(
            "Send error:",
            err
        );
    }
}

function broadcast(
    data,
    exceptId = null
) {

    for (
        const [id, connection]
        of connections
    ) {

        if (id === exceptId) {
            continue;
        }

        sendToConnection(
            connection,
            data
        );
    }
}

/* =========================================================
   PLAYER COUNT
========================================================= */

function updatePlayerCount() {

    const count =
        1 + remotePlayers.size;

    playerCount.textContent =
        "Players: " + count;

    if (isHost) {

        waitingStatus.textContent =
            count > 1
                ? "Player joined! You can enter the game."
                : "Waiting for players...";
    }
}

/* =========================================================
   COPY ROOM CODE
========================================================= */

copyBtn.addEventListener(
    "click",
    async function() {

        if (!currentRoom) {
            return;
        }

        try {

            await navigator.clipboard.writeText(
                currentRoom
            );

            showMessage(
                "Room code copied!"
            );

        } catch (err) {

            /*
               Fallback for browsers where
               clipboard API is unavailable.
            */

            const temp =
                document.createElement("textarea");

            temp.value =
                currentRoom;

            document.body.appendChild(temp);

            temp.select();

            document.execCommand("copy");

            temp.remove();

            showMessage(
                "Room code copied!"
            );
        }
    }
);

/* =========================================================
   ENTER GAME
========================================================= */

enterGameBtn.addEventListener(
    "click",
    function() {

        if (!peer) {

            showMessage(
                "Create or join a room first."
            );

            return;
        }

        showGame();

        showMessage(
            "Game started!"
        );
    }
);

/* =========================================================
   LEAVE ROOM
========================================================= */

leaveRoomBtn.addEventListener(
    "click",
    function() {

        resetMultiplayer();

        hideGame();

        showScreen(matchScreen);
    }
);

/* =========================================================
   RESET MULTIPLAYER
========================================================= */

function resetMultiplayer() {

    clearKeys();

    for (
        const connection
        of connections.values()
    ) {

        try {
            connection.close();
        } catch (err) {}
    }

    connections.clear();

    remotePlayers.clear();

    if (peer) {

        try {
            peer.destroy();
        } catch (err) {}
    }

    peer = null;

    currentRoom = null;
    isHost = false;

    player.id = null;

    roomCodeDisplay.textContent =
        "------";

    waitingStatus.textContent =
        "Waiting for players...";

    playerCount.textContent =
        "Players: 1";
}

/* =========================================================
   PHYSICS
========================================================= */

function updatePlayer(dt) {

    if (!gameStarted) {
        return;
    }

    let dx = 0;
    let dy = 0;

    if (keys["w"]) {
        dy -= 1;
    }

    if (keys["s"]) {
        dy += 1;
    }

    if (keys["a"]) {
        dx -= 1;
    }

    if (keys["d"]) {
        dx += 1;
    }

    const length =
        Math.sqrt(
            dx * dx +
            dy * dy
        );

    if (length > 0) {

        dx /= length;
        dy /= length;
    }

    const speed =
        keys["shift"]
            ? player.sprintSpeed
            : player.speed;

    const acceleration =
        2200;

    if (length > 0) {

        player.vx +=
            dx *
            acceleration *
            dt;

        player.vy +=
            dy *
            acceleration *
            dt;

    } else {

        const friction =
            Math.pow(
                0.001,
                dt
            );

        player.vx *= friction;
        player.vy *= friction;
    }

    const velocity =
        Math.sqrt(
            player.vx * player.vx +
            player.vy * player.vy
        );

    if (velocity > speed) {

        const factor =
            speed / velocity;

        player.vx *= factor;
        player.vy *= factor;
    }

    player.x +=
        player.vx * dt;

    player.y +=
        player.vy * dt;

    const margin =
        player.radius;

    player.x =
        Math.max(
            margin,
            Math.min(
                world.width - margin,
                player.x
            )
        );

    player.y =
        Math.max(
            margin,
            Math.min(
                world.height - margin,
                player.y
            )
        );
}

/* =========================================================
   REMOTE PLAYERS
========================================================= */

function updateRemotePlayers(dt) {

    for (
        const p
        of remotePlayers.values()
    ) {

        const smoothing =
            1 -
            Math.exp(
                -16 * dt
            );

        p.x +=
            (p.targetX - p.x) *
            smoothing;

        p.y +=
            (p.targetY - p.y) *
            smoothing;
    }
}

/* =========================================================
   CAMERA
========================================================= */

function updateCamera(dt) {

    const smoothing =
        1 -
        Math.exp(
            -10 * dt
        );

    camera.x +=
        (player.x - camera.x) *
        smoothing;

    camera.y +=
        (player.y - camera.y) *
        smoothing;
}

/* =========================================================
   NETWORK
========================================================= */

let networkTimer = 0;

function sendPositionUpdates(dt) {

    if (!gameStarted) {
        return;
    }

    networkTimer += dt;

    if (networkTimer < 1 / 30) {
        return;
    }

    networkTimer = 0;

    const packet = {

        type: "update",

        id: player.id,

        name: player.name,

        x: player.x,
        y: player.y,

        vx: player.vx,
        vy: player.vy,

        color: player.color
    };

    if (isHost) {

        broadcast(packet);

    } else {

        /*
           Joiners have exactly one
           host connection.
        */

        const hostConnection =
            connections.get("host");

        if (hostConnection) {

            sendToConnection(
                hostConnection,
                packet
            );
        }
    }
}

/* =========================================================
   WORLD DRAWING
========================================================= */

function drawWorld() {

    ctx.clearRect(
        0,
        0,
        width,
        height
    );

    ctx.fillStyle =
        "#11151c";

    ctx.fillRect(
        0,
        0,
        width,
        height
    );

    const left =
        width / 2 -
        camera.x;

    const top =
        height / 2 -
        camera.y;

    /*
       World background.
    */

    ctx.fillStyle =
        "#181d26";

    ctx.fillRect(
        left,
        top,
        world.width,
        world.height
    );

    /*
       Grid.
    */

    ctx.strokeStyle =
        "rgba(255,255,255,0.035)";

    ctx.lineWidth = 1;

    const startX =
        Math.floor(
            camera.x / world.gridSize
        ) *
        world.gridSize;

    const endX =
        camera.x +
        width;

    for (
        let x = startX;
        x <= endX;
        x += world.gridSize
    ) {

        const screenX =
            width / 2 +
            (x - camera.x);

        ctx.beginPath();

        ctx.moveTo(
            screenX,
            0
        );

        ctx.lineTo(
            screenX,
            height
        );

        ctx.stroke();
    }

    const startY =
        Math.floor(
            camera.y / world.gridSize
        ) *
        world.gridSize;

    const endY =
        camera.y +
        height;

    for (
        let y = startY;
        y <= endY;
        y += world.gridSize
    ) {

        const screenY =
            height / 2 +
            (y - camera.y);

        ctx.beginPath();

        ctx.moveTo(
            0,
            screenY
        );

        ctx.lineTo(
            width,
            screenY
        );

        ctx.stroke();
    }

    /*
       World border.
    */

    ctx.strokeStyle =
        "rgba(120,140,255,0.25)";

    ctx.lineWidth = 4;

    ctx.strokeRect(
        width / 2 -
            camera.x,
        height / 2 -
            camera.y,
        world.width,
        world.height
    );
}

/* =========================================================
   PLAYER DRAWING
========================================================= */

function drawPlayer(
    p,
    isLocal = false
) {

    const screenX =
        width / 2 +
        (p.x - camera.x);

    const screenY =
        height / 2 +
        (p.y - camera.y);

    /*
       Shadow.
    */

    ctx.beginPath();

    ctx.ellipse(
        screenX,
        screenY + p.radius * 0.72,
        p.radius * 0.9,
        p.radius * 0.35,
        0,
        0,
        Math.PI * 2
    );

    ctx.fillStyle =
        "rgba(0,0,0,0.3)";

    ctx.fill();

    /*
       Outer circle.
    */

    ctx.beginPath();

    ctx.arc(
        screenX,
        screenY,
        p.radius + 3,
        0,
        Math.PI * 2
    );

    ctx.fillStyle =
        "rgba(0,0,0,0.5)";

    ctx.fill();

    /*
       Player.
    */

    ctx.beginPath();

    ctx.arc(
        screenX,
        screenY,
        p.radius,
        0,
        Math.PI * 2
    );

    ctx.fillStyle =
        p.color;

    ctx.fill();

    /*
       Highlight.
    */

    ctx.beginPath();

    ctx.arc(
        screenX - 8,
        screenY - 9,
        7,
        0,
        Math.PI * 2
    );

    ctx.fillStyle =
        "rgba(255,255,255,0.2)";

    ctx.fill();

    /*
       Local player ring.
    */

    if (isLocal) {

        ctx.beginPath();

        ctx.arc(
            screenX,
            screenY,
            p.radius + 7,
            0,
            Math.PI * 2
        );

        ctx.strokeStyle =
            "rgba(255,255,255,0.55)";

        ctx.lineWidth = 2;

        ctx.stroke();
    }

    /*
       Name.
    */

    ctx.font =
        "bold 13px Arial";

    ctx.textAlign =
        "center";

    ctx.textBaseline =
        "bottom";

    ctx.fillStyle =
        "rgba(255,255,255,0.92)";

    ctx.fillText(
        p.name || "Player",
        screenX,
        screenY -
            p.radius -
            10
    );
}

/* =========================================================
   DRAW GAME
========================================================= */

function drawGame() {

    drawWorld();

    /*
       Draw remote players first.
    */

    for (
        const p
        of remotePlayers.values()
    ) {

        drawPlayer(
            p,
            false
        );
    }

    /*
       Draw local player last.
    */

    drawPlayer(
        player,
        true
    );
}

/* =========================================================
   GAME LOOP
========================================================= */

let lastTime =
    performance.now();

function gameLoop(now) {

    let dt =
        (now - lastTime) /
        1000;

    lastTime = now;

    /*
       Prevent giant physics jumps
       after tab switching.
    */

    dt =
        Math.min(
            dt,
            0.05
        );

    updatePlayer(dt);

    updateRemotePlayers(dt);

    updateCamera(dt);

    sendPositionUpdates(dt);

    drawGame();

    requestAnimationFrame(
        gameLoop
    );
}

requestAnimationFrame(
    gameLoop
);

/* =========================================================
   STARTUP
========================================================= */

showScreen(menuScreen);
hideGame();

</script>

</body>
</html>
